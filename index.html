<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#009EAE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<title>工作日誌</title>
<style>
/* 版面：左導覽｜主內容｜右側待辦欄；手機為單欄＋底部導覽。記事本格線為每日頁的識別。 */
:root{
  --bg:#F4F8FD; --surface:#FFFFFF; --surface-2:#EAF3FA; --line:#D6E4F0; --line-2:#E9F0F6;
  --fg:#203149; --fg-2:#50647C; --fg-3:#74869A;
  --accent:#0A97D9; --accent-fg:#FFFFFF; --accent-soft:#DDF4FD;
  --plan:#1764A9; --plan-bg:#E9F3FF; --done:#277342; --done-bg:#E9F7EE;
  --late:#BA2339; --late-bg:#FFE8EC; --pend:#B84E10; --pend-bg:#FFF0E4;
  --none:#8795A7; --none-bg:#EDF1F5; --star:#A67C00; --priv:#8E2D78; --priv-bg:#FBEAFA;
  --rule:rgba(10,151,217,.09); --shadow:0 8px 28px rgba(28,78,132,.13);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas","Noto Sans Mono CJK TC","Microsoft JhengHei",ui-monospace,monospace;
  --nav-w:188px; --rail-w:300px; --lh:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#171d26; --surface-2:#1e2632; --line:#2b3543; --line-2:#232c38;
  --fg:#e3e7ee; --fg-2:#a6afbd; --fg-3:#6e7888;
  --accent:#26BDE2; --accent-fg:#091B2B; --accent-soft:#14354A;
  --plan:#6CBDF0; --plan-bg:#19334D; --done:#82CA76; --done-bg:#1A3528; --late:#FF7183; --late-bg:#42232E;
  --pend:#FFAC71; --pend-bg:#412C21; --none:#8595A8; --none-bg:#293443; --star:#FDD65E; --priv:#E29BD1; --priv-bg:#39243A;
  --rule:rgba(143,178,230,.065); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#171d26; --surface-2:#1e2632; --line:#2b3543; --line-2:#232c38;
  --fg:#e3e7ee; --fg-2:#a6afbd; --fg-3:#6e7888;
  --accent:#26BDE2; --accent-fg:#091B2B; --accent-soft:#14354A;
  --plan:#6CBDF0; --plan-bg:#19334D; --done:#82CA76; --done-bg:#1A3528; --late:#FF7183; --late-bg:#42232E;
  --pend:#FFAC71; --pend-bg:#412C21; --none:#8595A8; --none-bg:#293443; --star:#FDD65E; --priv:#E29BD1; --priv-bg:#39243A;
  --rule:rgba(143,178,230,.065); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* 內頁：左上 X、底部儲存列、手機隱藏底部導覽 */
.xbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none;font-size:20px;line-height:1;padding:0;color:var(--fg)}
.xbtn:hover{border-color:var(--fg-3)}
.xbtn.back{font-size:24px;padding-bottom:3px}
.savebar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.savebar .btn.pri{min-width:150px;justify-content:center;min-height:42px;font-size:15px}
.savebar .state{margin-right:auto}
#main.swiping{transition:none}
#main.swipe-back{transform:translateX(40px);opacity:.6;transition:transform .15s,opacity .15s}
@media (max-width:1023px){body.inner #bnav{display:none}body.inner #main{padding-bottom:0}.savebar .btn.pri{flex:1;min-height:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100%;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr) var(--rail-w)}
#nav{display:flex;flex-direction:column;gap:2px;padding:18px 12px 18px 0;border-right:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 16px}
.brand b{font-size:17px;letter-spacing:.04em}
.brand span{font-size:11px;color:var(--fg-3)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--fg-2);text-align:left}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .k{margin-left:auto;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.navbtn svg,.bn svg{width:18px;height:18px;flex:none}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px}
.syncstate{font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.syncstate i{width:7px;height:7px;border-radius:50%;background:var(--pend);display:inline-block}

#main{overflow-y:auto;overflow-x:hidden;min-width:0;padding:18px 22px 40px}
#rail{border-left:1px solid var(--line);overflow-y:auto;padding:18px 0 18px 16px;min-width:0;background:var(--bg)}
#bnav{display:none}
@media (max-width:1279px){
  #app{grid-template-columns:var(--nav-w) minmax(0,1fr)}
  #rail{position:fixed;top:0;bottom:0;right:0;width:min(340px,92vw);z-index:45;transform:translateX(105%);transition:transform .2s;
    box-shadow:var(--shadow);padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px}
  #rail.open{transform:none}
}
@media (max-width:1023px){
  #app{grid-template-columns:minmax(0,1fr)}
  #nav{display:none}
  #main{padding:14px 0 calc(78px + env(safe-area-inset-bottom,0px))}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--fg-3);font-size:11px;min-height:48px;justify-content:center;cursor:pointer}
  .bn[aria-current="page"]{color:var(--accent);font-weight:600}
}

/* 通用元件 */
h1{font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:15px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--fg-2);font-weight:600;letter-spacing:.06em}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ph .sp{flex:1}
.sub{color:var(--fg-3);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--fg-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
.btn.sm{padding:3px 8px;min-height:28px;font-size:12px}
.btn kbd{font-size:10px;opacity:.7}
@media (max-width:1023px){.btn{min-height:40px}.btn.sm{min-height:34px}}
kbd,.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--fg-2);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--fg-2);min-height:32px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap;line-height:20px}
.chip.plan{background:var(--plan-bg);color:var(--plan)} .chip.done{background:var(--done-bg);color:var(--done)}
.chip.late{background:var(--late-bg);color:var(--late)} .chip.pend{background:var(--pend-bg);color:var(--pend)}
.chip.none{background:var(--none-bg);color:var(--none)} .chip.priv{background:var(--priv-bg);color:var(--priv)}
.chip.star{color:var(--star);background:none;padding:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pdot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-height:34px;min-width:0;width:100%}
textarea.f{line-height:1.6;resize:vertical}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-2);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.empty{padding:28px 12px;text-align:center;color:var(--fg-3)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--pend-bg);color:var(--fg);border:1px solid color-mix(in srgb,var(--pend) 35%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.banner b{color:var(--pend)}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
table.t th{color:var(--fg-3);font-weight:500;font-size:12px;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.privacy .pv{filter:blur(6px);user-select:none;pointer-events:none}

/* 提醒 */
.rem{display:flex;flex-direction:column;gap:6px}
.rem-i{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--surface-2);cursor:pointer;border:0;text-align:left;width:100%;color:var(--fg)}
.rem-i:hover{outline:1px solid var(--line)}
.rem-i .tag{flex:none;font-size:11px;border-radius:4px;padding:0 5px;line-height:18px;margin-top:1px}
.tag.r{background:var(--late-bg);color:var(--late)} .tag.o{background:var(--pend-bg);color:var(--pend)} .tag.b{background:var(--plan-bg);color:var(--plan)} .tag.y{color:var(--star);background:none;padding:0}

/* 月曆 */
.calhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px;font-size:12px;color:var(--fg-3);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{position:relative;min-height:92px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 7px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0;color:var(--fg)}
.cell:hover{border-color:var(--fg-3)}
.cell.out{opacity:.4}
.cell.off{background:var(--surface-2)}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell .dn{font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px}
.cell .hn{font-size:10px;color:var(--late);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .hrs{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.cell .mk{display:flex;gap:3px;align-items:center;flex-wrap:wrap;font-size:11px}
.cell .lv{position:absolute;left:0;right:0;bottom:0;background:var(--priv-bg);border-top:1px solid color-mix(in srgb,var(--priv) 40%,transparent);pointer-events:none}
.cell .lvt{position:relative;font-size:10px;color:var(--priv)}
.cell > *{position:relative}
@media (max-width:1023px){.cell{min-height:64px;padding:4px}.cell .hn{display:none}.cell .hrs{font-size:10px}.calhead,.cal{gap:2px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px}
.wkcol{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px;min-height:220px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.wkcol.today{border-color:var(--accent)}
.wkt{font-size:12px;line-height:1.4;padding:4px 6px;border-radius:6px;background:var(--surface-2)}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.mm{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px}
.mm h4{margin:0 0 6px;font-size:13px;cursor:pointer}
.mmg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mmc{aspect-ratio:1;border-radius:3px;border:0;padding:0;cursor:pointer;font-size:9px;color:var(--fg-3);background:var(--surface-2);max-width:100%}
.mmc.e{background:none;cursor:default}

/* 每日頁 */
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dayhead h1{font-size:20px;white-space:nowrap}
.tool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.state{font-size:12px;color:var(--fg-3);display:inline-flex;align-items:center;gap:5px}
.state i{width:7px;height:7px;border-radius:50%;background:var(--none)}
.state.dirty i{background:var(--pend)} .state.saved i{background:var(--done)} .state.tpl i{background:var(--plan)}
.infobar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ed{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));background-size:100% var(--lh);background-position:0 14px;background-origin:padding-box}
.ed pre,.ed textarea{margin:0;padding:14px 16px;font-size:14px;line-height:var(--lh);font-family:var(--edf);white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;tab-size:4;letter-spacing:0;border:0;width:100%}
.ed pre{min-height:520px;color:var(--fg);pointer-events:none}
.ed textarea{position:absolute;inset:0;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--fg);outline:none;border-radius:12px}
.ed textarea::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:transparent}
.ed.read pre{pointer-events:auto;min-height:200px}
.ed.read textarea{display:none}
.hl-h{color:var(--accent);font-weight:inherit}
.ed.read .hl-h{font-weight:700}
.hl-c{color:var(--plan)} .hl-c.c2{color:var(--done)} .hl-c.c3{color:var(--pend)}
.hl-hr{background:var(--surface-2);border-radius:3px}
.hl-dl{color:var(--late)} .hl-star{color:var(--star)}
.hl-x{color:var(--fg-3)}
.hl-p{color:var(--priv)}
.hl-w{background:var(--pend-bg);border-radius:2px}
.hl-meta{color:var(--fg-3)}
.prev{margin-top:14px}
.pi{display:flex;gap:6px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line-2);font-size:13px;min-width:0}
.pi:last-child{border-bottom:0}
.pi .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.pi .hr{font-variant-numeric:tabular-nums;color:var(--fg-2);white-space:nowrap;font-size:12px}
.warn{background:var(--pend-bg);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.warn code{font-family:var(--mono);overflow-wrap:anywhere}
.pv-block.hidden-priv{padding:10px;color:var(--fg-3);font-size:12px}

/* 待辦／筆記 */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--fg-2);min-height:32px}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab .c{font-size:11px;opacity:.75;margin-left:4px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li.sel{background:var(--accent-soft)}
.li .main{flex:1;min-width:0}
.li .ttl{font-weight:500;overflow-wrap:anywhere}
.li .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--fg-3);align-items:center}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--fg-3);background:none;flex:none;display:grid;place-items:center;cursor:pointer;margin-top:1px;padding:0;color:var(--accent-fg)}
.ck.on{background:var(--done);border-color:var(--done)}
.ck svg{width:12px;height:12px}
.notes{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1023px){.notes{grid-template-columns:minmax(0,1fr)}.notes.editing .nlist{display:none}.notes:not(.editing) .neditor{display:none}}
.md h1,.md h2,.md h3{margin:.6em 0 .3em}
.md p{margin:.3em 0}
.md ul{margin:.3em 0;padding-left:1.3em}

/* 專案／甘特 */
.pcard{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.pcard:hover{border-color:var(--fg-3)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:10px}
.tl .tli{position:relative;font-size:13px}
.tl .tli::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--done);border:2px solid var(--surface)}
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh}
.g{position:relative;display:grid;grid-template-columns:200px auto}
@media (max-width:1023px){.g{grid-template-columns:120px auto}}
.gl{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);padding:0 8px;display:flex;align-items:center;gap:6px;height:34px;border-bottom:1px solid var(--line-2);font-size:12px;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gl.sub{padding-left:22px;color:var(--fg-2);height:26px}
.gl.sel{background:var(--accent-soft)}
.gl.head{position:sticky;top:0;z-index:4;height:40px;cursor:default;font-weight:600}
.gt{position:relative;height:34px;border-bottom:1px solid var(--line-2)}
.gt.sub{height:26px}
.gt.head{position:sticky;top:0;z-index:2;background:var(--surface);height:40px;font-size:11px;color:var(--fg-3)}

.gact{position:absolute;top:12px;height:10px;border-radius:2px}
.gdl{position:absolute;top:3px;font-size:12px;transform:translateX(-50%)}
.gtd{position:absolute;top:8px;width:9px;height:9px;border-radius:50%;transform:translateX(-50%)}
.gtoday{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--late);z-index:1;pointer-events:none}

/* 統計 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg)}

.kpi span{font-size:12px;color:var(--fg-3)}
.hb{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12px;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:var(--fg)}
.hbr .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr .tr{height:16px;display:flex;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.hbr .tr i{display:block;height:100%}
.hbr .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.cols{display:flex;align-items:flex-end;gap:3px;height:170px;border-bottom:1px solid var(--line);padding-top:8px;position:relative}
.cols .c{flex:1;display:flex;flex-direction:column-reverse;min-width:3px;cursor:pointer;height:100%;justify-content:flex-start;border:0;background:none;padding:0}
.cols .c i{display:block;width:100%}

.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2);font-size:10px;color:var(--fg-3);pointer-events:none}
.gridline span{position:absolute;right:0;top:-14px}
.xl{display:flex;gap:3px;font-size:10px;color:var(--fg-3);margin-top:4px}
.xl span{flex:1;text-align:center;min-width:3px;overflow:hidden;white-space:nowrap}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg-2);margin-top:8px}

/* Modal／面板 */

  padding:calc(6vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}

  chainId:id,carriedCount:0,source:'daily',origin:'plan',createdByDay:null,closedByDay:null,archived:false,deliveredAt:null,note:'',doneText:'',rawLine:'',createdAt:Date.now(),updatedAt:Date.now()},o||{});

function bigr(s){s=nk(s);const a=new Map();for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);a.set(g,(a.get(g)||0)+1)}return a}
function sim(a,b){a=nk(a);b=nk(b);if(!a||!b)return 0;if(a===b)return 1;if(a.length<2||b.length<2)return a.includes(b)||b.includes(a)?.6:0;const A=bigr(a),B=bigr(b);let n=0;A.forEach((v,k)=>{n+=Math.min(v,B.get(k)||0)});return 2*n/(a.length+b.length-2)}
function bestMatch(cands,it,used){
  const pid=findProject(it.project)?.id;
  const pool=cands.filter(t=>!used.has(t.id));
  const same=pool.filter(t=>t.projectId===pid);
  const txt=it.title+(it.subs||[]).join('')+(it.doneText||'');
  const score=t=>sim(t.title+(t.subItems||[]).map(s=>s.text).join(''),txt)+(t.category===it.cat?.15:0);
  if(same.length===1)return same[0];
  if(same.length>1)return same.sort(by(score,-1))[0];
  const other=pool.filter(t=>t.category===it.cat&&score(t)>=.65).sort(by(score,-1));
  return other[0]||null}
function taskContent(t){const subs=(t.subItems||[]).map(s=>s.text);const joined=subs.join('、');
  if(subs.length>1){if(!t.title||t.title===joined||nk(t.title)===nk(subs.join(',')))return joined;return `${t.title}：${joined}`}
  return t.title||''}
function lineFromTask(t,o={}){const proj=pname(t.projectId);const c=taskContent(t);
  let s=`${t.category}-${proj}`+(t.estHours!=null?`_${hrTok(t.estHours)}`:'')+(c&&c!==proj?`，${c}`:'');
  if(o.extras!==false){if(t.isStar)s+='｜⭐';if(t.dl)s+=`｜DL：${mmdd(t.dl)}`;if(t.doneCriteria)s+=`｜完成標準：${t.doneCriteria}`;if(t.stopLoss)s+=`｜停損點：${t.stopLoss}`;if(t.deliverTo)s+=`｜交付：${t.deliverTo}`}
  return s}
function mergeSubs(old,texts){return texts.map(x=>{const o=(old||[]).find(s=>nk(s.text)===nk(x));return o?Object.assign({},o,{text:x}):{id:uid(),text:x,status:'規劃'}})}
function setDL(t,dl,reason){if(!dl||t.dl===dl)return;if(t.dl)t.dlHistory.push({from:t.dl,to:dl,reason:reason||'',changedAt:today()});t.dl=dl}
function applyItemFields(t,it,ref){
  t.category=it.cat;t.projectId=resolveProject(it.project,it.cat);
  const keepTitle=it.subs.length>1&&t.subItems.length>1&&nk(t.subItems.map(s=>s.text).join(''))===nk(it.subs.join(''))&&t.title&&t.title!==it.title;
  if(!keepTitle)t.title=it.title;
  t.subItems=mergeSubs(t.subItems,it.subs);
  if(it.est!=null)t.estHours=it.est;
  t.isStar=!!it.star;
  if(it.dl){const d=resolveMD(parseDL(it.dl),ref,'future');if(d)setDL(t,d,'日誌更新')}
  if(it.doneCriteria)t.doneCriteria=it.doneCriteria;if(it.stopLoss)t.stopLoss=it.stopLoss;
  if(it.deliverTo)t.deliverTo=it.deliverTo;if(it.outcome)t.outcome=it.outcome;
  if(it.note)t.note=it.note;
  t.rawLine=it.raw;t.updatedAt=Date.now()}

/* ---------- 每日存檔：解析並寫入結構化資料 ---------- */
function applyDay(D,text,opt={}){
  const r=parseDay(text);
  const Pd=prevWorkday(D);
  const prevDay=db.days[D]||{};
  db.days[D]={rawText:text,locations:r.header.locations||[],leaves:r.header.leaves||[],reviewSummary:prevDay.reviewSummary,
    warnings:r.warnings.map(w=>({line:w.i,text:w.raw,why:w.why,level:w.level,sec:w.sec||''})),updatedAt:Date.now(),createdAt:prevDay.createdAt||Date.now()};
  // 1. 還原此日上次存檔造成的影響
  for(const t of T()){
    if(t.closedByDay===D){t.status=t._ps||'規劃';t.actual={office:t._pa??null};if(t._psub)t.subItems=t._psub;t.deliveredAt=t._pdv??null;t.doneText=t._pdt||'';t.delayReasonText=t._pdr||'';t.delayReasonTag=t._pdg||'';
      t.closedByDay=null;delete t._ps;delete t._pa;delete t._psub;delete t._pdv;delete t._pdt;delete t._pdr;delete t._pdg}
    if(t.createdByDay===D&&(t.origin==='backfill'||t.origin==='urgent'))delete db.tasks[t.id]}
  db.ot=db.ot.filter(o=>o.sourceDay!==D);
  const oldCarries=T().filter(t=>t.source==='carry'&&t.createdByDay===D);
  // 3. 昨日（上一工作日）回寫
  const prevPlan=T().filter(t=>t.date===Pd&&t.origin==='plan');const used2=new Set();
  const snap=t=>{t._ps=t.status;t._pa=t.actual?.office??null;t._psub=structuredClone(t.subItems);t._pdv=t.deliveredAt;t._pdt=t.doneText;t._pdr=t.delayReasonText;t._pdg=t.delayReasonTag;t.closedByDay=D};
  for(const it of r.done){
    let t=bestMatch(prevPlan,it,used2);
    if(t){used2.add(t.id);snap(t)}
    else{t=newTask({date:Pd,origin:'backfill',source:'backfill',createdByDay:D});applyItemFields(t,it,Pd)}
    if(it.est!=null&&t.estHours==null)t.estHours=it.est;
    t.actual={office:it.actual};
    t.status=it.delivered||t.status==='已交付'?'已交付':'完成';
    if(t.status==='已交付'&&!t.deliveredAt)t.deliveredAt=Pd;
    t.subItems=t.subItems.map(s=>Object.assign({},s,{status:'完成'}));
    if(it.doneText)t.doneText=it.doneText;if(it.outcome)t.outcome=it.outcome;if(it.deliverTo)t.deliverTo=it.deliverTo;
    if(it.dl){const d=resolveMD(parseDL(it.dl),Pd,'future');if(d)setDL(t,d,'日誌更新')}
    if(it.note&&!t.note)t.note=it.note;t.updatedAt=Date.now()}
  const carries=[];
  for(const it of r.undone){
    let t=bestMatch(prevPlan,it,used2);
    if(t){used2.add(t.id);snap(t)}
    else{t=newTask({date:Pd,origin:'backfill',source:'backfill',createdByDay:D});applyItemFields(t,it,Pd)}
    t.status='延遲';t.actual={office:it.actual};
    t.delayReasonText=it.reason||t.delayReasonText;t.delayReasonTag=reasonTag(it.reason)||t.delayReasonTag;
    if(it.subs.length&&t.subItems.length){const keep=it.subs.map(nk);t.subItems=t.subItems.map(s=>Object.assign({},s,{status:keep.includes(nk(s.text))?'延遲':'完成'}))}
    t.updatedAt=Date.now();
    if(it.newDate){const nd=resolveMD(it.newDate,D,'future');if(nd)carries.push({src:t,date:nd,it})}}
  for(const it of r.urgent){
    const t=newTask({date:Pd,origin:'urgent',source:'urgent',createdByDay:D,isUrgent:true});
    applyItemFields(t,it,Pd);
    // 突發只列不計：同一件事已寫在「昨日完成／未完成」時，工時已算在那裡，突發這筆不再計時
    const h=it.actual??it.est;const listed=[...r.done,...r.undone].some(x=>findProject(x.project)?.id===t.projectId&&(sim((x.title||'')+(x.doneText||''),(it.title||'')+(it.doneText||''))>=.4||(x.actual!=null&&x.actual===h)));
    t.actual={office:listed?null:h};t.urgentHours=h;t.countedElsewhere=listed;
    if(it.urgentStatus==='未完成'){t.status='延遲';t.delayReasonText=it.reason||'';t.delayReasonTag=reasonTag(it.reason);
      if(it.newDate){const nd=resolveMD(it.newDate,D,'future');if(nd)carries.push({src:t,date:nd,it})}}
    else{t.status=it.delivered?'已交付':'完成';if(t.status==='已交付')t.deliveredAt=Pd}
    if(it.doneText)t.doneText=it.doneText}
  for(const o of r.ot){
    const pl=T().filter(t=>t.date===Pd);let pid=null;
    for(const p of Object.values(db.projects))if(o.text&&(o.text.includes(p.name)||(p.aliases||[]).some(a=>a&&o.text.includes(a)))){pid=p.id;break}
    if(!pid){const m=pl.map(t=>[t,sim(t.title,o.text)]).sort(by(x=>x[1],-1))[0];if(m&&m[1]>.3)pid=m[0].projectId}
    db.ot.push({id:uid(),date:Pd,type:o.type,hours:o.hours,text:o.text,projectId:pid,sourceDay:D})}
  // 4. 延遲項目延續至新日期
  const keepCarry=new Set();const toReapply=[];
  const sameDayLines=[];
  for(const c of carries){
    let ct=oldCarries.find(x=>x.chainId===c.src.chainId&&!keepCarry.has(x.id))||oldCarries.find(x=>!keepCarry.has(x.id)&&x.projectId===c.src.projectId&&sim(x.title,c.src.title)>.6);
    if(ct)ct.chainId=c.src.chainId;
    const remaining=c.src.subItems.filter(s=>s.status==='延遲').map(s=>s.text);
    if(!ct){ct=newTask({source:'carry',origin:'plan',createdByDay:D,chainId:c.src.chainId,status:'規劃'})}

    ct.carriedCount=(c.src.carriedCount||0)+1;ct.deliverTo=c.src.deliverTo;ct.doneCriteria=c.src.doneCriteria;ct.stopLoss=c.src.stopLoss;
    if(ct.date!==c.date){ct.date=c.date;ct.rawLine=''}
    ct.updatedAt=Date.now();
    const td=db.days[c.date];
    if(td&&td.rawText&&c.date!==D&&!opt.noCascade){const pr=parseDay(td.rawText);const already=pr.today.some(x=>findProject(x.project)?.id===ct.projectId&&sim(x.title,ct.title)>.6);
      if(!already)toReapply.push([c.date,insertTodayLine(td.rawText,lineFromTask(ct))])}
    if(c.date===D&&!r.today.some(x=>findProject(x.project)?.id===ct.projectId&&sim(x.title,ct.title)>.6))sameDayLines.push(lineFromTask(ct))}
  if(sameDayLines.length){for(const l of sameDayLines)text=insertTodayLine(text,l);db.days[D].rawText=text;r.today=parseDay(text).today}
  // 2. 今日工作項目
  const plan=T().filter(t=>t.date===D&&t.origin==='plan');const used=new Set();
  for(const it of r.today){
    let t=bestMatch(plan,it,used);
    if(!t)t=newTask({date:D,origin:'plan',source:'daily',createdByDay:D,status:'規劃'});
    used.add(t.id);applyItemFields(t,it,D);
    if(t.status==='待辦')t.status='規劃';
    if(it.delivered&&t.status!=='已交付'){t.status='已交付';t.deliveredAt=D}}
  for(const t of plan){if(used.has(t.id))continue;
    if(t.source==='daily'&&t.createdByDay===D&&t.closedByDay==null){delete db.tasks[t.id];continue}
    if(t.source==='daily'&&t.closedByDay){continue}
    if(t.source==='carry'&&t.createdByDay===D){continue}
    t.date=null;t.status='待辦';t.source='todo';t.origin='plan';t.rawLine=''}
  for(const ct of oldCarries){if(keepCarry.has(ct.id))continue;const td=db.days[ct.date];
    if(td&&td.rawText&&ct.rawLine&&td.rawText.includes(ct.rawLine)){ct.createdByDay=null}else delete db.tasks[ct.id]}
  for(const[d,txt]of toReapply)applyDay(d,txt,{noCascade:true});
  return r}
function insertTodayLine(text,line){
  const ls=String(text||'').split('\n');let hi=ls.findIndex(l=>secOf(N(l))==='today');
  if(hi<0){let k=0;while(k<ls.length&&/^(日期|姓名|辦公地|請假)\s*[:：]/.test(ls[k].trim()))k++;ls.splice(k,0,'','今日工作項目',line);return ls.join('\n')}
  let j=hi+1,last=hi;
  while(j<ls.length){const t=N(ls[j]);if(secOf(t)||/^[—─\-=_]{3,}$/.test(t)||/^私記/.test(t))break;if(t&&!/^無$/.test(t))last=j;j++}
  if(last===hi&&j>hi+1&&/^無$/.test(N(ls[hi+1]))){ls[hi+1]=line;return ls.join('\n')}
  if(last===hi&&ls[hi+1]!==undefined&&N(ls[hi+1])===''&&!(secOf(N(ls[hi+2]||'')))){ls[hi+1]=line;return ls.join('\n')}
  ls.splice(last+1,0,line);return ls.join('\n')}
function removeLine(text,raw){const ls=String(text||'').split('\n');const i=ls.findIndex(l=>l===raw||N(l)===N(raw));if(i>=0)ls.splice(i,1);return ls.join('\n')}

/* ---------- 模板 ---------- */
function template(D){
  const s=db.settings,Pd=prevWorkday(D);
  const L=[`日期：${D}（${wd(D)}）`,`姓名：${s.displayName}`,'辦公地：','請假：','','今日工作項目'];
  const plan=T().filter(t=>t.date===D&&t.origin==='plan').sort(by(t=>t.isStar?0:1));
  if(plan.length)plan.forEach(t=>L.push(lineFromTask(t)));else L.push('');
  L.push('','昨日完成');
  const pp=T().filter(t=>t.date===Pd&&t.origin==='plan');
  const ok=pp.filter(t=>!['延遲','放棄'].includes(t.status)),late=pp.filter(t=>t.status==='延遲');
  if(ok.length)ok.forEach(t=>{const c=taskContent(t);L.push(`${t.category}-${pname(t.projectId)}_預${hrTok(t.estHours)||'＿hr'}，實${t.actual?.office!=null?hrTok(t.actual.office):'＿hr'}`+(c&&c!==pname(t.projectId)?`，${c}`:''))});else L.push('無');
  L.push('','昨日未完成');
  if(late.length)late.forEach(t=>L.push(`${t.category}-${pname(t.projectId)}｜${taskContent(t)}_${hrTok(t.estHours)||'＿hr'}，因${t.delayReasonText||'＿＿'}，擬${mmdd(D)}完成`));else L.push('無');
  L.push('','昨日新增突發工作','無','','—————','私記（勿外流）','');
  return L.join('\n')}

/* ---------- 匯出 ---------- */
const EXTRA_RE=/^\s*(⭐|完成標準\s*[:：]|停損點\s*[:：]|DL\s*[:：]|dl\s*[:：]|交付\s*[:：]|成果\s*[:：]|已交付\s*$)/;
function teamsText(D,o){
  const raw=db.days[D]?.rawText??drafts[D]??'';const out=[`${db.settings.teamsName}${md(D)}`,''];let inPriv=false;
  for(const line of raw.split('\n')){const t=N(line);
    if(!inPriv&&(/^[—─\-=_]{3,}$/.test(t)||/^私記/.test(t))){inPriv=true;if(o.priv){out.push('—————','私記（勿外流）')}continue}
    if(inPriv){if(o.priv&&!/^私記/.test(t))out.push(line);continue}
    if(/^日期\s*:/.test(t)||/^姓名\s*:/.test(t))continue;
    if(/^辦公地\s*:/.test(t)){if(o.loc&&t.replace(/^辦公地\s*:/,'').trim())out.push(line);continue}
    if(/^請假\s*:/.test(t)){if(o.leave&&t.replace(/^請假\s*:/,'').trim())out.push(line);continue}
    let l=line;
    if(!o.extras){const segs=l.split(/[｜|]/);l=segs.filter((g,i)=>i===0||!EXTRA_RE.test(g)).join('｜').replace(/⭐\s*/g,'').replace(/\s+$/,'')}
    out.push(l)}
  return out.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'').replace(new RegExp('^('+db.settings.teamsName+md(D).replace('/','\\/')+')\\n+'),'$1\n\n')}
function weekRange(d){const g=pd(d).getDay();const mon=addD(d,-((g+6)%7));return[mon,addD(mon,6)]}
function weeklyText(anchor){
  const[a,b]=weekRange(anchor);const ts=T().filter(t=>t.date&&t.date>=a&&t.date<=b);
  const byP={};for(const t of ts){(byP[t.projectId]=byP[t.projectId]||[]).push(t)}
  const rows=Object.entries(byP).map(([pid,list])=>({pid,list,h:sum(list,t=>t.actual?.office)})).sort(by(x=>x.h,-1));
  const L=[`${db.settings.teamsName} 週報 ${md(a)}–${md(b)}`,''];
  rows.forEach((r,i)=>{const p=P(r.pid);const name=pname(r.pid);
    const deliv=r.list.filter(t=>t.status==='已交付'||t.status==='完成');
    const late=r.list.filter(t=>t.status==='延遲');
    const dlch=[...r.list.flatMap(t=>(t.dlHistory||[]).filter(h=>h.changedAt>=a&&h.changedAt<=b).map(h=>`${t.title} DL ${md(h.from)}→${md(h.to)}${h.reason?`（${h.reason}）`:''}`)),...((p?.dlHistory||[]).filter(h=>h.changedAt>=a&&h.changedAt<=b).map(h=>`專案 DL ${md(h.from)}→${md(h.to)}${h.reason?`（${h.reason}）`:''}`))];
    const risk=[];if(p?.dl){const left=diffD(today(),p.dl);if(left<0)risk.push(`專案 DL ${md(p.dl)} 已逾期 ${-left} 天`);else if(left<=14)risk.push(`專案 DL ${md(p.dl)}，剩 ${left} 天`)}
    late.forEach(t=>risk.push(`${t.title} 延遲${t.delayReasonText?`（${t.delayReasonText}）`:''}`));
    if(i<2){L.push(`【${name}】`);
      L.push(`① 已完成交付物：${deliv.length?deliv.map(t=>t.title+(t.status==='已交付'?'（已交付）':'')).join('、'):'無'}`);
      L.push(`② 里程碑與變動：${dlch.length?dlch.join('；'):'無變動'}${risk.length?`｜風險：${risk.join('；')}`:''}`);
      L.push('');}
    else L.push(`・${name}：本週 ${fh(r.h)}hr，完成 ${deliv.length} 項${late.length?`，延遲 ${late.length} 項`:''}`)});
  if(!rows.length)L.push('本週無紀錄');
  return L.join('\n').trim()}
function aiPack(from,to,o){

  const L=[s.aiPrompt.replace(/\{期間\}/g,`${from} ～ ${to}`),'',`【期間】${from} ～ ${to}`];
  if(o.deliv){L.push('','【交付清單與成果】');const dv=T().filter(t=>t.status==='已交付'&&(t.deliveredAt||t.date)>=from&&(t.deliveredAt||t.date)<=to).sort(by(t=>t.deliveredAt||t.date));
    if(!dv.length)L.push('（無）');dv.forEach(t=>L.push(`- ${t.deliveredAt||t.date}｜${pname(t.projectId)}｜${t.title}${t.deliverTo?`｜交付：${t.deliverTo}`:''}${t.outcome?`｜成果：${t.outcome}`:''}${t.dl?`｜DL ${t.dl}`:''}`))}
  if(o.proj){L.push('','【專案工時與期間】');const st=projStats(from,to);
    st.forEach(x=>L.push(`- ${x.name}（${x.cat}）：${x.first}～${x.last}，投入 ${x.days} 天，辦公室 ${fh(x.office)}hr＝${fh(x.office/hpd())} 人日${o.ot?`；申報 ${fh(x.decl)}hr、無償 ${fh(x.unpaid)}hr`:''}；完成 ${x.done} 項、交付 ${x.deliv} 項`))}
  if(o.ontime){const S=calcStats(from,to);L.push('','【準時率與延遲】',`- 有 DL 的交付 ${S.ontime.n} 項，準時 ${S.ontime.ok} 項（${S.ontime.n?Math.round(S.ontime.ok/S.ontime.n*100):'—'}%）`,`- 延遲 ${S.delays.n} 次；原因：${Object.entries(S.delays.tags).map(([k,v])=>`${k} ${v}`).join('、')||'無'}`)}
  if(o.ot){const S=calcStats(from,to);L.push('','【加班】',`- 無償 ${fh(S.unpaid)}hr，申報 ${fh(S.decl)}hr，轉補休 ${fh(S.comp)}hr`)}
  if(o.leave){const S=calcStats(from,to);L.push('','【請假】',...(Object.entries(S.leaves).map(([k,v])=>`- ${k} ${fh(v)}hr（${fh(v/hpd())} 天）`)),Object.keys(S.leaves).length?'':'（無）')}
  if(o.priv){L.push('','【私記】');Object.keys(db.days).filter(d=>d>=from&&d<=to).sort().forEach(d=>{const p=privPart(db.days[d].rawText);if(p.trim())L.push(`${d}：${p.trim().replace(/\n/g,'／')}`)})}
  return L.filter(x=>x!==undefined).join('\n')}
function privPart(text){const ls=String(text||'').split('\n');const i=ls.findIndex(l=>/^[—─\-=_]{3,}$/.test(N(l))||/^私記/.test(N(l)));if(i<0)return'';return ls.slice(i+1).filter(l=>!/^私記/.test(N(l))).join('\n')}
function csvEsc(v){v=v==null?'':String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}
function toCSV(rows){return rows.map(r=>r.map(csvEsc).join(',')).join('\n')}

function periodRange(kind,a){const y=+a.slice(0,4),m=+a.slice(5,7);
  if(kind==='day')return[a,a];if(kind==='week')return weekRange(a);
  if(kind==='month'){const e=iso(new Date(y,m,0));return[`${y}-${pad(m)}-01`,e]}
  if(kind==='half')return m<=6?[`${y}-01-01`,`${y}-06-30`]:[`${y}-07-01`,`${y}-12-31`];
  if(kind==='year')return[`${y}-01-01`,`${y}-12-31`];
  return[S.statFrom||a,S.statTo||a]}
function periodShift(kind,a,dir){const y=+a.slice(0,4),m=+a.slice(5,7);
  if(kind==='day')return addD(a,dir);if(kind==='week')return addD(a,7*dir);
  if(kind==='month')return iso(new Date(y,m-1+dir,1));if(kind==='half')return iso(new Date(y,m-1+6*dir,1));if(kind==='year')return `${y+dir}-01-01`;return a}
function periodLabel(kind,a){const[f,t]=periodRange(kind,a);const y=a.slice(0,4),m=+a.slice(5,7);
  return kind==='day'?`${a}（${wd(a)}）`:kind==='week'?`${f} ～ ${t}`:kind==='month'?`${y} 年 ${m} 月`:kind==='half'?`${y} ${m<=6?'上半年':'下半年'}`:kind==='year'?`${y} 年`:`${f} ～ ${t}`}
function calcStats(from,to){
  const ts=T().filter(t=>t.date&&t.date>=from&&t.date<=to&&t.status!=='待辦');
  const ots=db.ot.filter(o=>o.date>=from&&o.date<=to);
  const office=sum(ts,t=>t.actual?.office);
  const unpaid=sum(ots.filter(o=>o.type==='無償'),o=>o.hours),decl=sum(ots.filter(o=>o.type==='申報'),o=>o.hours),comp=sum(ots.filter(o=>o.type==='補休'),o=>o.hours);
  const dset=new Set();let x=from;let wdays=0;
  while(x<=to){if(isWorkday(x)){wdays++;const has=ts.some(t=>t.date===x)||db.days[x]?.rawText;if(has&&leaveHours(x)<hpd())dset.add(x)}x=addD(x,1);if(diffD(from,x)>800)break}
  const byProj={};for(const t of ts){const k=t.projectId;byProj[k]=byProj[k]||{office:0,unpaid:0,decl:0};byProj[k].office+=t.actual?.office||0}
  for(const o of ots){const k=o.projectId||'_none';byProj[k]=byProj[k]||{office:0,unpaid:0,decl:0};if(o.type==='無償')byProj[k].unpaid+=o.hours;else byProj[k].decl+=o.hours}
  const byCat={};categories().forEach(c=>byCat[c]=0);ts.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+(t.actual?.office||0)});
  const acc={};categories().forEach(c=>{const l=ts.filter(t=>t.category===c&&t.estHours>0&&t.actual?.office!=null);acc[c]={e:sum(l,t=>t.estHours),a:sum(l,t=>t.actual.office),n:l.length}});
  const dv=T().filter(t=>t.status==='已交付'&&t.dl&&(t.deliveredAt||t.date)>=from&&(t.deliveredAt||t.date)<=to);
  const ontime={n:dv.length,ok:dv.filter(t=>(t.deliveredAt||t.date)<=t.dl).length,list:dv};
  const lt=ts.filter(t=>t.status==='延遲');const tags={};lt.forEach(t=>{const k=t.delayReasonTag||'未填';tags[k]=(tags[k]||0)+1});
  const leaves={};const locs={};let trips=0;const tripDays=new Set();
  Object.keys(db.days).filter(d=>d>=from&&d<=to).forEach(d=>{const dd=db.days[d];(dd.leaves||[]).forEach(l=>leaves[l.type]=(leaves[l.type]||0)+l.hours);
    const seen=new Set();(dd.locations||[]).forEach(l=>{if(!seen.has(l.place)){locs[l.place]=(locs[l.place]||0)+1;seen.add(l.place)}if(l.trip)tripDays.add(d)})});
  trips=tripDays.size;
  const yr=to.slice(0,4);const compEarned=sum(db.ot.filter(o=>o.type==='補休'&&o.date.startsWith(yr)&&o.date<=to),o=>o.hours);
  const compUsed=sum(Object.keys(db.days).filter(d=>d.startsWith(yr)&&d<=to),d=>sum((db.days[d].leaves||[]).filter(l=>l.type==='補休'),l=>l.hours));
  const missing=ts.filter(t=>t.origin==='plan'&&t.actual?.office==null&&t.date<today()&&!['延遲','放棄','規劃'].includes(t.status)).length;
  return{ts,ots,office,unpaid,decl,comp,days:dset.size,wdays,byProj,byCat,acc,ontime,delays:{n:lt.length,tags,list:lt},leaves,locs,trips,compEarned,compUsed,missing}}
function projStats(from,to){
  const ts=T().filter(t=>t.date&&t.date>=from&&t.date<=to&&t.status!=='待辦');const m={};
  for(const t of ts){const k=t.projectId;m[k]=m[k]||{pid:k,dates:new Set(),office:0,unpaid:0,decl:0,done:0,deliv:0};m[k].dates.add(t.date);m[k].office+=t.actual?.office||0;if(['完成','已交付'].includes(t.status))m[k].done++;if(t.status==='已交付')m[k].deliv++}
  for(const o of db.ot.filter(o=>o.date>=from&&o.date<=to&&o.projectId)){const k=o.projectId;m[k]=m[k]||{pid:k,dates:new Set(),office:0,unpaid:0,decl:0,done:0,deliv:0};if(o.type==='無償')m[k].unpaid+=o.hours;else m[k].decl+=o.hours}
  return Object.values(m).map(x=>{const ds=[...x.dates].sort();return Object.assign(x,{name:pname(x.pid),cat:P(x.pid)?.category||'',first:ds[0]||'',last:ds[ds.length-1]||'',days:ds.length})}).sort(by(x=>x.office+x.unpaid+x.decl,-1))}
function projDetail(pid){
  const p=P(pid);const ts=T().filter(t=>t.projectId===pid);const dated=ts.filter(t=>t.date&&t.status!=='待辦');

  return{p,ts,dated,ds,office,unpaid,decl,first,last,span:first&&last?diffD(first,last)+1:0,days:ds.length,byCat,remain,deliv,
    notes:Object.values(db.notes).filter(n=>(n.projectIds||[]).includes(pid))}}

function reminders(){
  const D=today(),tm=nextWorkday(D),out=[];const open=t=>!['完成','已交付','放棄'].includes(t.status)&&!t.archived;
  T().filter(t=>t.date===D&&t.isStar).forEach(t=>out.push({k:'y',tag:'⭐ 主星',txt:`${pname(t.projectId)}｜${t.title}`,go:['day',D]}));
  T().filter(t=>open(t)&&t.dl&&t.dl===D).forEach(t=>out.push({k:'r',tag:'今天到期',txt:`${pname(t.projectId)}｜${t.title}`,go:['task',t.id]}));
  T().filter(t=>open(t)&&t.dl&&t.dl>D&&t.dl<=tm).forEach(t=>out.push({k:'o',tag:'明天到期',txt:`${pname(t.projectId)}｜${t.title}`,go:['task',t.id]}));
  T().filter(t=>open(t)&&t.dl&&t.dl<D).forEach(t=>out.push({k:'r',tag:`逾期 ${diffD(t.dl,D)} 天`,txt:`${pname(t.projectId)}｜${t.title}`,go:['task',t.id]}));
  Object.values(db.projects).filter(p=>p.status==='進行中'&&p.dl).forEach(p=>{const l=diffD(D,p.dl);if(l<0)out.push({k:'r',tag:`專案逾期 ${-l} 天`,txt:p.name,go:['proj',p.id]});else if(l<=1)out.push({k:'r',tag:l?'專案明天到期':'專案今天到期',txt:p.name,go:['proj',p.id]})});
  T().filter(t=>t.source==='todo'&&!t.date&&open(t)&&t.dl&&t.dl>=D&&diffD(D,t.dl)<=7).forEach(t=>out.push({k:'o',tag:`${diffD(D,t.dl)} 天後到期・未排日`,txt:`${pname(t.projectId)}｜${t.title}`,go:['task',t.id]}));
  const Pd=prevWorkday(D);if(!db.days[D]?.rawText){const miss=T().filter(t=>t.date===Pd&&t.origin==='plan'&&t.actual?.office==null&&!['延遲','放棄'].includes(t.status));if(miss.length)out.push({k:'b',tag:'待填',txt:`${md(Pd)} 有 ${miss.length} 項尚未填實際工時`,go:['day',D]})}
  Object.values(db.projects).filter(p=>p.status==='進行中'&&p.dl&&p.dl>=D).forEach(p=>{const rem=sum(T().filter(t=>t.projectId===p.id&&['待辦','規劃'].includes(t.status)),t=>t.estHours);const cap=workdaysBetween(D,p.dl)*hpd();if(rem>cap)out.push({k:'r',tag:'排程不足',txt:`${p.name}：剩餘預估 ${fh(rem)}hr ＞ 可用 ${fh(cap)}hr`,go:['proj',p.id]})});
  if(!db.sample){const lb=db.settings.lastBackup;if(!lb||diffD(lb,D)>30)out.push({k:'b',tag:'備份',txt:lb?`上次備份 ${lb}，已超過 30 天`:'尚未備份過資料',go:['backup']})}
  return out}

function checkMorningReminder(){
 const now=new Date(),D=iso(now),mins=now.getHours()*60+now.getMinutes();
 if(mins<9*60+30||!isWorkingDay(D)||reminderShown.has(D)||modalStack.length)return;
 if(document.activeElement?.closest?.('input,textarea,select'))return;
 if(S.page==='day'&&S.day===D)return;
 const saved=db.days[D]?.rawText||'';
 if(saved&&parseDay(saved).today.length>0)return;
 reminderShown.add(D);
 openModal({title:'09:30 工作日誌提醒',body:`<p>今天 ${D} 尚未登打今日工作項目。</p><p class="sub">可直接進入今日工作項目，完成後再複製並上傳 Teams。</p>`,foot:'<button class="btn" data-act="mclose">稍後再填</button><button class="btn pri" id="rem-edit">前往今日工作</button>',onMount:ov=>{$('#rem-edit',ov).onclick=()=>{closeModal();openDay(D);S.guideSub=false;render();setTimeout(()=>$('#guided-host')?.scrollIntoView({block:'start',behavior:'smooth'}),60)}}});
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已複製');return true}catch(e){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'已複製':'無法自動複製，請手動選取');return ok}}

/* ---------- Modal ---------- */
let modalStack=[];
function openModal({title,body,foot,wide,onMount,onClose,cls}){
  const root=$('#modal-root');const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md-box ${wide?'wide':''} ${cls||''}" role="dialog" aria-modal="true" aria-label="${esc(title||'')}">${title!=null?`<div class="md-h"><button class="xbtn" data-act="mclose" aria-label="關閉（Esc）">×</button><h2>${esc(title)}</h2></div>`:''}<div class="md-b">${body||''}</div>${foot?`<div class="md-f">${foot}</div>`:''}</div>`;
  const prevFocus=document.activeElement;root.appendChild(ov);
  const m={ov,onClose,prevFocus};modalStack.push(m);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  ov.addEventListener('keydown',e=>{if(e.key==='Tab'){const f=$$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])',ov).filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){b.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===b){a.focus();e.preventDefault()}}});
  onMount&&onMount(ov);
  const af=$('[autofocus]',ov)||$('input,textarea,select,button',ov);af&&setTimeout(()=>af.focus(),0);
  return ov}
function closeModal(){const m=modalStack.pop();if(!m)return;m.ov.remove();m.onClose&&m.onClose();m.prevFocus&&m.prevFocus.focus&&document.contains(m.prevFocus)&&m.prevFocus.focus()}
/* 頁內確認：取代瀏覽器 confirm。ask() 回傳 false 並開啟確認框；按確定後重新執行 retry，此時 ask() 回傳 true。 */
let _askOk=false;
function ask(msg,retry,label='確定'){if(_askOk){_askOk=false;return true}
  openModal({title:'請確認',body:`<p style="margin:0;white-space:pre-line">${esc(msg)}</p>`,foot:`<button class="btn" data-act="mclose">取消</button><button class="btn pri" id="ask-yes">${esc(label)}</button>`,
    onMount:ov=>{$('#ask-yes',ov).onclick=()=>{closeModal();_askOk=true;try{retry()}finally{_askOk=false}}}});return false}
function noticeBox(title,msg){openModal({title,body:`<p style="margin:0;white-space:pre-line">${esc(msg)}</p>`,foot:'<button class="btn pri" data-act="mclose">知道了</button>'})}
function inputBox(title,label,value,done){openModal({title,body:`<label class="fl">${esc(label)}<input type="text" id="ib-v" value="${esc(value||'')}" autofocus></label>`,foot:'<button class="btn" data-act="mclose">取消</button><button class="btn pri" id="ib-ok">確定</button>',
  onMount:ov=>{const ok=()=>{const v=$('#ib-v',ov).value;closeModal();done(v)};$('#ib-ok',ov).onclick=ok;$('#ib-v',ov).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ok()}})}})}
function confirmBox(msg,yes,label='確定'){openModal({title:'請確認',body:`<p style="margin:0">${msg}</p>`,foot:`<button class="btn" data-act="mclose">取消</button><button class="btn danger" id="cf-yes">${esc(label)}</button>`,
  onMount:ov=>{$('#cf-yes',ov).onclick=()=>{closeModal();yes()}}})}
function textModal(title,text,extra=''){openModal({title,wide:true,body:`${extra}<textarea class="f mono" id="tm-ta" rows="16" style="font-size:12px">${esc(text)}</textarea>`,
  foot:`<button class="btn" data-act="mclose">關閉</button><button class="btn pri" id="tm-cp">複製</button>`,onMount:ov=>{$('#tm-cp',ov).onclick=()=>copy($('#tm-ta',ov).value)}})}

const WEEK_KEY='workcal.weekly.v1';
let weekStore=db?.weekly||{};try{if(!Object.keys(weekStore).length)weekStore=JSON.parse(localStorage.getItem(WEEK_KEY)||'{}')||{}}catch(e){}
let weekAnchor=today(),weekDraft='';
function weekSave(){db.weekly=weekStore;persist()}
function wkData(){const [m]=weekRange(weekAnchor);if(!weekStore[m])weekStore[m]={items:[],report:''};return weekStore[m]}
function weekAdd(){const title=$('#wk-title')?.value.trim(),cat=$('#wk-cat')?.value||'例行',group=$('#wk-group')?.value||'小組例行任務',date=$('#wk-date')?.value,h=+($('#wk-hours')?.value||0),detail=$('#wk-detail')?.value.trim(),dl=$('#wk-dl')?.value;
 if(!title||!date||!(h>=0)||!Number.isFinite(h)){toast('請填工作名稱、日期及有效工時');return}const [ws,we]=weekRange(weekAnchor);if(date<ws||date>we){toast('預定日期請選擇目前顯示的週期間');return}
 wkData().items.push({id:uid(),title,cat,group,date,h,detail,dl,added:false});weekSave();render();toast('已加入週工作計畫')}
function weekCarry(){const [a]=weekRange(weekAnchor),[prevA,prevB]=[addD(a,-7),addD(a,-1)];const last=T().filter(t=>t.date>=prevA&&t.date<=prevB&&!['完成','已交付','放棄'].includes(t.status)&&t.origin==='plan');let n=0;
 for(const t of last){const title=pname(t.projectId);if(wkData().items.some(x=>x.title===title&&x.detail===t.title))continue;wkData().items.push({id:uid(),title,cat:t.category||'專案',group:'小組例行任務',date:a,h:t.estHours||0,detail:t.title,dl:t.dl||'',added:false});n++}weekSave();render();toast(n?`承接 ${n} 筆延遲任務，請核對日期與預估工時`:'上週無可承接的延遲任務')}
function weekRemove(i){wkData().items.splice(i,1);weekSave();render()}
function weekBring(i){const it=wkData().items[i];if(!it)return;const base=dayText(it.date),line=`${it.cat}-${it.title}_${hrTok(it.h)}${it.detail?'，'+it.detail:''}`;
 const parsed=parseDay(base);if(parsed.today.some(x=>x.raw.trim()===line.trim())){toast('這項工作已存在日誌');return}
 const merged=guideReplaceSection(base,'today',[...parsed.today.map(x=>x.raw),line]);
 if(db.days[it.date]?.rawText&&!ask('將新增此項到 '+it.date+' 的今日工作項目，保留原有其他內容，確認？',()=>weekBring(i),'帶入日誌'))return;
 applyDay(it.date,merged);persist();it.added=true;weekSave();render();toast('已帶入 '+it.date+' 日誌')}
function weekReportText(){const [a,b]=weekRange(weekAnchor),prevA=addD(a,-7),prevB=addD(a,-1);
 const last=T().filter(x=>x.date>=prevA&&x.date<=prevB);
 const undone=last.filter(x=>!['完成','已交付','放棄'].includes(x.status)&&x.origin==='plan');
 const urgent=last.filter(x=>x.isUrgent||x.category==='突發'||x.origin==='urgent');
 const groups=['小組例行任務','KM 專案','CHT 專案'];
 const result=[];
 for(const g of groups){const plans=wkData().items.filter(x=>(x.group||'小組例行任務')===g);
  const pl=plans.map(x=>`- ${x.title}${x.detail?'：'+x.detail:''}（馬）${x.dl?' DL '+x.dl:''}｜${x.date} 預估 ${fh(x.h)}hr`);
  result.push(`【${g}】`,`上週未完成`,`- 待核對上週紀錄（無項目請改為「無：馬」）`,`上週突發或臨時新增`,`- 待核對上週紀錄（無項目請改為「無：馬」）`,`本週預定要做的事情（含 DL）`,...(pl.length?pl:['- 無（馬）']),'');}
 const names=t=>`${pname(t.projectId)}：${t.title}${t.dl?'｜DL '+t.dl:''}`;
 result.push('【待人工確認的上週紀錄（僅供分類參考，請移到對應區塊）】');
 result.push('未完成：'+(undone.length?undone.map(names).join('；'):'沒有可判定的未完成資料'));
 result.push('突發：'+(urgent.length?urgent.map(names).join('；'):'沒有突發紀錄'));
 result.push('備註：僅依已登錄資料提供候選項目，不會推定工作類別、完成狀態或其他人的工作。');
 return result.join('\n');
}

 <div class="week-stats">本週計畫 ${fh(total)}hr／一般週參考 40hr｜當週日誌預估 ${fh(est)}hr｜已登記實際 ${fh(actual)}hr｜週計畫 ${w.items.length} 項（依請假、假日調整）</div>
 <div class="week-grid"><section class="week-panel"><h2>本週／下週預估工作</h2><div class="fgrid"><label class="fl">回報區塊<select id="wk-group"><option>小組例行任務</option><option>KM 專案</option><option>CHT 專案</option></select></label><label class="fl">分類<select id="wk-cat">${categories().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="fl">工作名稱<input id="wk-title" placeholder="例如：通路小教室維護"></label><label class="fl">預定日期<input id="wk-date" type="date" value="${a}"></label><label class="fl">預估工時 hr<input id="wk-hours" type="number" value="2" min="0" step="0.5"></label><label class="fl">DL<input id="wk-dl" type="date"></label><label class="fl">工作內容<input id="wk-detail" placeholder="具體預計產出"></label></div><div class="g-actions week-plan-actions"><button class="btn pri" data-act="weekadd" style="margin-top:10px;margin-right:10px;margin-bottom:12px">新增週計畫</button><button class="btn" data-act="weekcarry" style="margin-top:10px;margin-bottom:12px">承接上週未完成候選</button></div>${registered||'<div class="empty">目前無週計畫，可先新增。</div>'}</section>
 <section class="week-panel"><h2>產生我的週接龍</h2><p class="sub">僅整理你的內容（馬／馬哥／小馬）。範例來源分組無法由原日誌確定時，以「請確認」保留人工分類；不處理其他同事，不與每日 Teams 回報相連。</p><button class="btn sm" data-act="weekreload">依紀錄重新彙整</button><textarea class="f mono" rows="18" id="wk-report" placeholder="點擊重新彙整，再編輯並保存你的版本">${esc(w.report||'')}</textarea><div class="g-actions"><button class="btn pri" id="wk-save" type="button">保存個人週報</button><button class="btn" id="wk-copy" type="button">複製個人接龍文字</button></div><p class="sub">已保存的週報只更新你自己的資料；週計畫與每日紀錄變更時請重新彙整並核對。</p></section></div>`}

// 跨欄位工時檢核：只提示異常，不修改或阻擋原始紀錄。
const wcHourAlertCache=new Map();
function wcTimeMinutes(v){
 const m=String(v||'').match(/^([01]\d|2[0-3]):([0-5]\d)$/);
 return m?(+m[1])*60+(+m[2]):null;
}
function wcAuditData(D){
 const r=parseDay(dayText(D));
 const leaves=r.header.leaves||[], locations=r.header.locations||[];
 const leave=leaves.reduce((a,l)=>a+(Number(l.hours)||0),0);
 const validPlanned=r.today.filter(x=>x.est!=null&&Number.isFinite(Number(x.est)));
 const planned=validPlanned.reduce((a,x)=>a+Number(x.est),0);
 const finished=T().filter(t=>t.date===D&&t.origin==='plan'&&t.actual&&t.actual.office!=null&&Number.isFinite(Number(t.actual.office)));
 // 實際工時未完整時不將部分實績與全部預排混成單一確定值。
 const actual=finished.reduce((a,t)=>a+Number(t.actual.office),0);
 const allHaveActual=!!validPlanned.length&&finished.length>=validPlanned.length;
 const work=allHaveActual?actual:planned;
 const source=allHaveActual?'實際':'預排';
 const errors=[];
 if(!(r.today.length||leaves.length||locations.length))return {errors,planned,leave,work,source,total:0};
 const total=work+leave;
 if(total<7-1e-5)errors.push(`工作${source} ${fh(work)}h ＋ 請假／補休 ${fh(leave)}h＝${fh(total)}h，低於 7h，差 ${fh(7-total)}h`);
 if(total>8+1e-5)errors.push(`工作${source} ${fh(work)}h ＋ 請假／補休 ${fh(leave)}h＝${fh(total)}h，超出 8h 共 ${fh(total-8)}h`);
 if(leave>8+1e-5)errors.push(`請假／補休共 ${fh(leave)}h，超過單日 8h，請確認是否有重複登記`);
 const segments=[];
 for(const loc of locations){
  if(!loc.start&&!loc.end)continue;
  const start=wcTimeMinutes(loc.start),end=wcTimeMinutes(loc.end);
  if(start===null||end===null||end<=start){errors.push(`辦公地「${loc.place||'未命名'}」起訖時間不完整或順序錯誤`);continue}
  segments.push({start,end,place:loc.place||'未命名'});
 }
 segments.sort((a,b)=>a.start-b.start||a.end-b.end);
 let merged=0,end=-1,overlap=false;
 for(const seg of segments){
  if(seg.start<end)overlap=true;
  merged+=Math.max(0,seg.end-Math.max(end,seg.start));
  end=Math.max(end,seg.end);
 }
 if(overlap)errors.push('辦公地／出差時段互相重疊，請確認是否重複填寫；工時檢核已去除重疊時段');
 if(segments.length){
  const span=merged/60;
  if(work>span+1e-5)errors.push(`工作${source} ${fh(work)}h 超過辦公地有效時段跨度 ${fh(span)}h`);
  // 上班時段通常含午休，但沒有精確休息設定，不能自動扣除固定一小時。
  if(leave>=7&&span>=7&&work>0)errors.push(`請假 ${fh(leave)}h，卻仍記錄 ${fh(span)}h 的辦公地時段及 ${fh(work)}h 工作，請確認請假與出勤是否衝突`);
  if(leave>0&&work>0&&work+leave>span+1e-5)errors.push(`工作加請假 ${fh(total)}h，超過辦公地時段跨度 ${fh(span)}h，請確認請假時段及休息時間`);
 }
 return {errors:[...new Set(errors)],planned,leave,work,source,total};
}
function wcHoursAlert(D){
 const data=wcAuditData(D), signature=data.errors.join('|');
 if(!signature){wcHourAlertCache.delete(D);return}
 if(wcHourAlertCache.get(D)===signature)return;

}

function guideMergeHeader(text){

function hlHTML(text,r,read){
  const ls=text.split('\n');const bad=new Set(r.warnings.filter(w=>w.level==='err').map(w=>w.i));
  // 解析時可能前置拆行；只有行數一致才逐行上色
  const aligned=r.lines.length===ls.length;
  let inPriv=false;
  return ls.map((line,i)=>{const t=N(line);
    if(!inPriv&&(/^[—─\-=_]{3,}$/.test(t)||/^私記/.test(t)))inPriv=true;
    if(inPriv){if(read&&S.privacy)return i===ls.findIndex(l=>/^[—─\-=_]{3,}$/.test(N(l))||/^私記/.test(N(l)))?'<span class="hl-p">（隱私模式：私記已隱藏）</span>':'';return `<span class="hl-p">${esc(line)}</span>`}
    if(secOf(t))return `<span class="hl-h">${esc(line)}</span>`;
    if(/^(日期|姓名|辦公地|請假)\s*:/.test(t))return `<span class="hl-meta">${esc(line)}</span>`;
    const w=aligned&&bad.has(i);
    let h=esc(line);

    h=h.replace(/(預\s*)?(\d+(?:\.\d+)?\s*(?:hr|h|min|分鐘|小時)|＿hr)/g,m0=>`<span class="hl-hr">${m0}</span>`);
    h=h.replace(/([｜|]\s*)(DL\s*[:：]\s*[\d\/\-]+)/g,'$1<span class="hl-dl">$2</span>');
    h=h.replace(/⭐/g,'<span class="hl-star">⭐</span>');
    h=h.replace(/([｜|]\s*)((?:完成標準|停損點|交付|成果)\s*[:：][^｜|]*|已交付)/g,'$1<span class="hl-x">$2</span>');

function todoGroups(){

  const open=t=>!t.archived&&!['已交付','放棄'].includes(t.status);
  const overdue=all.filter(t=>open(t)&&!['完成'].includes(t.status)&&t.dl&&t.dl<D);
  const od=new Set(overdue.map(t=>t.id));
  let arch=all.filter(t=>t.archived);
  if(S.archYear!=='all')arch=arch.filter(t=>(t.deliveredAt||t.date||'').startsWith(S.archYear));
  if(S.archProj!=='all')arch=arch.filter(t=>t.projectId===S.archProj);
  return{'未排日':all.filter(t=>open(t)&&!t.date&&!od.has(t.id)).sort(by(t=>t.dl||'9999')),

    '逾期':overdue.sort(by(t=>t.dl||t.date)),
    '封存':arch.sort(by(t=>t.deliveredAt||t.date||'',-1))}}

function expandLongEntry(el){
  if(!el)return;
  const computed=getComputedStyle(el);
  const min=parseFloat(computed.minHeight)||0;
  const max=Math.max(min,Math.round(window.innerHeight*(window.innerWidth<=700?.52:.65)));
  // Preserve user drag sizing; grow only when text requires more space.
  const target=Math.min(max,Math.max(min,el.scrollHeight));
  if(el.clientHeight+2<target)el.style.height=target+'px';
}

  ${!isNew&&t.rawLine?`<div class="sub">日誌原文：<span class="mono">${esc(t.rawLine)}</span></div>`:''}`}
function openTask(id,opts={}){
  const isNew=!id;const t=isNew?Object.assign({category:'專案',projectId:opts.projectId||null,title:opts.title||'',subItems:[],estHours:null,actual:{office:null},status:'待辦',isStar:false,dl:null,dlHistory:[],doneCriteria:'',stopLoss:'',deliverTo:'',outcome:'',delayReasonTag:'',delayReasonText:'',date:null},opts):db.tasks[id];
  if(!t)return;
  openModal({title:isNew?'新增待辦':'編輯任務',body:taskForm(t,isNew),
    foot:`${isNew?'':`<button class="btn danger" id="tf-del">${t.archived?'永久刪除':'刪除'}</button><span style="flex:1"></span>`}${isNew?'<button class="btn" data-act="mclose">取消</button>':'<span class="state saved" id="tf-st"><i></i>修改即自動儲存</span>'}<button class="btn pri" id="tf-ok">${isNew?'新增':'儲存並返回'}</button>`,
    onMount:ov=>{
      $$('.long-entry',ov).forEach(el=>{expandLongEntry(el);el.addEventListener('input',()=>expandLongEntry(el))});
      const chk=()=>{const w=[];const dl=$('#tf-dl',ov).value;const pid=findProject($('#tf-proj',ov).value)?.id;const p=pid&&P(pid);
        if(dl&&p?.dl&&dl>p.dl)w.push(`任務 DL（${dl}）晚於專案 DL（${p.dl}）`);
        if(dl&&!isNew&&t.dl&&dl!==t.dl)$('#tf-dlr-w',ov).hidden=false;
        const est=+$('#tf-est',ov).value||0;if(dl&&est){const cap=workdaysBetween(today(),dl)*hpd();if(est>cap)w.push(`DL 前可用工時 ${cap}hr 少於預估 ${est}hr`)}
        $('#tf-warn',ov).innerHTML=w.map(x=>`<div class="warn">${esc(x)}</div>`).join('')};
      ['tf-dl','tf-proj','tf-est'].forEach(k=>$('#'+k,ov).addEventListener('input',chk));chk();
      const commit=(close)=>{
        const title=$('#tf-title',ov).value.trim();if(!title){if(close){$('#tf-title',ov).focus();toast('請填任務名稱')}return}
        const o=isNew?newTask({source:'todo',origin:'plan',status:'待辦',date:null}):t;
        const oldDate=o.date,oldLine=o.rawLine;
        o.category=$('#tf-cat',ov).value;o.projectId=resolveProject($('#tf-proj',ov).value.trim()||'（未指定）',o.category);o.title=title;
        const subs=$('#tf-subs',ov).value.split('\n').map(x=>x.trim()).filter(Boolean);
        o.subItems=subs.map(x=>{const d=/^\[x\]\s*/i.test(x);const tx=x.replace(/^\[x\]\s*/i,'');const old=(o.subItems||[]).find(s=>s.text===tx);return{id:old?.id||uid(),text:tx,status:d?'完成':(old&&old.status!=='完成'?old.status:'規劃')}});
        o.progressLog=$('#tf-progress',ov).value.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{const m=line.match(/^(\d{4}-\d{2}-\d{2})[｜|]\s*(.*)$/);return m?{date:m[1],text:m[2]}:{date:'',text:line}});
        const e=$('#tf-est',ov).value;o.estHours=e===''?null:+e;
        if(!isNew){const a=$('#tf-act',ov).value;o.actual={office:a===''?null:+a}}
        const dl=$('#tf-dl',ov).value||null;if(dl!==o.dl){if(o.dl&&dl)o.dlHistory.push({from:o.dl,to:dl,reason:$('#tf-dlr',ov).value.trim(),changedAt:today()});o.dl=dl}
        let st=$('#tf-st',ov).value;o.isStar=$('#tf-star',ov).value==='1';
        o.doneCriteria=$('#tf-dc',ov).value.trim();o.stopLoss=$('#tf-sl',ov).value.trim();o.deliverTo=$('#tf-to',ov).value.trim();o.outcome=$('#tf-out',ov).value.trim();
        o.delayReasonTag=$('#tf-rt',ov).value;o.delayReasonText=$('#tf-rx',ov).value.trim();o.riskProfile={importance:$('#tf-ri',ov).value,impact:$('#tf-rh',ov).value,likelihood:$('#tf-rl',ov).value};
        const nd=$('#tf-date',ov).value||null;
        if(st==='已交付'&&!o.deliveredAt)o.deliveredAt=today();
        if(['已交付','放棄'].includes(st)&&(o.source==='todo'||o.source==='carry'))o.archived=true;
        o.status=st;o.updatedAt=Date.now();
        if(close)closeModal();
        if(nd!==oldDate){if(oldDate&&db.days[oldDate]?.rawText&&oldLine){o.date=null;applyDay(oldDate,removeLine(db.days[oldDate].rawText,oldLine))}
          if(nd)scheduleTask(o.id,nd,true);else{o.date=null;if(o.status==='規劃')o.status='待辦';o.source=o.source==='daily'?'todo':o.source}}
        else if(o.date&&o.origin==='plan'&&db.days[o.date]?.rawText&&oldLine){const nl=lineFromTask(o);if(nl!==oldLine){const txt=db.days[o.date].rawText.split('\n').map(l=>l===oldLine?nl:l).join('\n');const keep=o.status;applyDay(o.date,txt);o.status=keep}}
        persist();render._keep=true;render();
        if(close)toast(isNew?'已新增待辦':'已儲存');else{const s2=$('#tf-st',ov);if(s2){const d=new Date();s2.innerHTML=`<i></i>已自動儲存 ${pad(d.getHours())}:${pad(d.getMinutes())}`}}};
      $('#tf-ok',ov).onclick=()=>commit(true);
      if(!isNew){let at,pend=false;const auto=()=>{clearTimeout(at);pend=true;const s2=$('#tf-st',ov);if(s2){s2.className='state dirty';s2.innerHTML='<i></i>輸入中…'}at=setTimeout(()=>{pend=false;if(document.contains(ov)){commit(false);const s3=$('#tf-st',ov);if(s3)s3.className='state saved'}},800)};
        $$('input,textarea',ov).forEach(el=>el.addEventListener('input',auto));$$('select,input[type=date]',ov).forEach(el=>el.addEventListener('change',auto));
        const m=modalStack[modalStack.length-1];const oc=m.onClose;m.onClose=()=>{clearTimeout(at);if(pend){pend=false;commit(false)}oc&&oc()}}
      const del=$('#tf-del',ov);if(del)del.onclick=()=>{closeModal();safeDeleteTask(t.id)}}})}
function scheduleTask(id,date,silent){
  const t=db.tasks[id];if(!t)return;t.date=date;t.origin='plan';if(t.status==='待辦')t.status='規劃';if(t.source==='daily')t.source='todo';
  const dd=db.days[date];
  if(S.page==='day'&&S.day===date&&$('#ta')){const ta=$('#ta');ta.value=insertTodayLine(ta.value,lineFromTask(t));ta.dispatchEvent(new Event('input'));t.rawLine=lineFromTask(t)}
  else if(dd?.rawText){applyDay(date,insertTodayLine(dd.rawText,lineFromTask(t)))}
  persist();if(!silent)toast(`已排入 ${md(date)}`)}
function schedPrompt(id){const t=db.tasks[id];if(!t)return;
  openModal({title:'排入某天',body:`<div class="sub">${esc(t.title)}</div><label class="fl">日期<input type="date" id="sp-d" value="${t.date||today()}" autofocus></label><div class="row">${[0,1,2].map(n=>{const d=n===0?today():n===1?nextWorkday(today()):nextWorkday(nextWorkday(today()));return`<button class="btn sm" data-q="${d}">${n===0?'今天':n===1?'下個工作日':'再下個工作日'} ${md(d)}</button>`}).join('')}</div>`,
    foot:`${t.date?'<button class="btn" id="sp-un">取消排日</button><span style="flex:1"></span>':''}<button class="btn" data-act="mclose">取消</button><button class="btn pri" id="sp-ok">排入</button>`,
    onMount:ov=>{$$('[data-q]',ov).forEach(b=>b.onclick=()=>{$('#sp-d',ov).value=b.dataset.q});
      $('#sp-d',ov).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#sp-ok',ov).click()}});
      $('#sp-ok',ov).onclick=()=>{const d=$('#sp-d',ov).value;if(!d)return;closeModal();
        if(t.date&&t.date!==d&&db.days[t.date]?.rawText&&t.rawLine){const od=t.date;t.date=null;applyDay(od,removeLine(db.days[od].rawText,t.rawLine))}
        scheduleTask(id,d);render._keep=true;render()};
      const un=$('#sp-un',ov);if(un)un.onclick=()=>{closeModal();const od=t.date;if(db.days[od]?.rawText&&t.rawLine)applyDay(od,removeLine(db.days[od].rawText,t.rawLine));t.date=null;t.status='待辦';t.source='todo';persist();render()}}})}
function dlPrompt(id){const t=db.tasks[id];if(!t)return;
  openModal({title:'設定 DL',body:`<div class="sub">${esc(t.title)}</div><label class="fl">DL<input type="date" id="dp-d" value="${t.dl||''}" autofocus></label>${t.dl?'<label class="fl">改期原因<input type="text" id="dp-r"></label>':''}`,
    foot:`<button class="btn" data-act="mclose">取消</button><button class="btn pri" id="dp-ok">儲存</button>`,
    onMount:ov=>{$('#dp-ok',ov).onclick=()=>{const d=$('#dp-d',ov).value||null;if(d!==t.dl){if(t.dl&&d)t.dlHistory.push({from:t.dl,to:d,reason:$('#dp-r',ov)?.value.trim()||'',changedAt:today()});t.dl=d}persist();closeModal();render._keep=true;render()}}})}
function safeDeleteTask(id){
 const t=db.tasks[id];if(!t)return;
 const date=t.date,original=db.days[date]?.rawText||'',line=t.rawLine||'';
 const match=line&&original.split('\n').some(x=>x===line||N(x)===N(line));
 const label=esc(t.title||'未命名待辦');
 const warning=match?'已找到精確對應的日誌原文，將同步移除該行。':date&&original?'此項有關聯日誌，但無法確定對應文字。原始日誌會保留，請自行核對。':'其他日期與工作日誌維持原狀。';
 confirmBox(`確定永久刪除「${label}」？子項與進度紀錄會一併移除。<br><br>${warning}`,()=>{
   if(match){const next=removeLine(original,line);applyDay(date,next)}
   delete db.tasks[id];persist();render();toast('已刪除指定待辦');
 },'確認刪除');
}
function toggleDone(id){const t=db.tasks[id];if(!t)return;if(['完成','已交付'].includes(t.status)){t.status=t.date?'規劃':'待辦';t.archived=false;t.deliveredAt=null}else{t.status='完成';t.subItems=(t.subItems||[]).map(s=>Object.assign({},s,{status:'完成'}))}persist();render._keep=true;render()}
function deliverPrompt(id){const t=db.tasks[id];if(!t)return;

/* ---------- 筆記 ---------- */
function mdHTML(s){return esc(s).split('\n').map(l=>{
  if(/^### /.test(l))return`<h3>${l.slice(4)}</h3>`;if(/^## /.test(l))return`<h2>${l.slice(3)}</h2>`;if(/^# /.test(l))return`<h1 style="font-size:18px">${l.slice(2)}</h1>`;
  l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(/^- \[( |x)\] /i.test(l))return`<div>${/^- \[x\]/i.test(l)?'☑':'☐'} ${l.slice(6)}</div>`;
  if(/^- /.test(l))return`<div style="padding-left:1em;text-indent:-.8em">• ${l.slice(2)}</div>`;
  return l?`<p>${l}</p>`:''}).join('')}
function pgNotes(){
  const q=S.noteQ.trim();let ns=Object.values(db.notes);if(q)ns=ns.filter(n=>(n.title+n.body+(n.projectIds||[]).map(pname).join('')).includes(q));
  ns.sort((a,b)=>(b.pinned-a.pinned)||(b.updatedAt-a.updatedAt));
  const cur=db.notes[S.noteSel];
  return`<div class="ph"><h1>筆記</h1><span class="sub">不綁日期、不計工時</span><span class="sp"></span><button class="btn pri" data-act="newnote">＋ 新增筆記 <kbd>N</kbd></button></div>
  <div class="notes ${cur?'editing':''}">
    <div class="nlist stack"><input type="search" id="nq" placeholder="搜尋筆記" value="${esc(S.noteQ)}" aria-label="搜尋筆記">
      ${ns.length?`<div class="list" id="notelist" tabindex="0">${ns.map((n,i)=>`<div class="li ${n.id===S.noteSel?'sel':''}" data-act="notesel" data-id="${n.id}"><div class="main"><div class="ttl">${n.pinned?'📌 ':''}${esc(n.title||'（無標題）')}</div><div class="meta">${new Date(n.updatedAt).toLocaleDateString('zh-TW')}${(n.projectIds||[]).map(p=>`<span class="chip"><span class="pdot" style="background:${pcolor(p)}"></span>${esc(pname(p))}</span>`).join('')}</div></div></div>`).join('')}</div>`:'<div class="empty">沒有筆記。按「新增筆記」開始。</div>'}</div>
    <div class="neditor">${cur?noteEditor(cur):'<div class="card empty">選一則筆記，或新增一則。</div>'}</div></div>`}

      <input type="text" id="n-proj" list="n-pl" placeholder="加專案標籤，Enter" style="width:180px"><datalist id="n-pl">${Object.values(db.projects).map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></div>

function saveNoteNow(){const n=db.notes[S.noteSel];const ti=$('#n-title'),bo=$('#n-body');if(!n||!ti||!bo)return;
  if(n.title!==ti.value||n.body!==bo.value){n.title=ti.value;n.body=bo.value;n.updatedAt=Date.now();persist()}
  const pv=$('#n-prev');if(pv)pv.innerHTML=mdHTML(n.body);const st=$('#n-st');if(st){const d=new Date();st.className='state saved';st.innerHTML=`<i></i>已自動儲存 ${pad(d.getHours())}:${pad(d.getMinutes())}`}}
after.notes=()=>{
  const q=$('#nq');if(q){q.addEventListener('input',()=>{S.noteQ=q.value;const p=q.selectionStart;render();const q2=$('#nq');q2.focus();q2.setSelectionRange(p,p)})}
  const n=db.notes[S.noteSel];if(!n)return;
  const longNote=$('#n-body');expandLongEntry(longNote);longNote?.addEventListener('input',()=>expandLongEntry(longNote));
  const save=()=>{saveNoteNow()};
  let tm;['n-title','n-body'].forEach(k=>$('#'+k).addEventListener('input',()=>{const st=$('#n-st');st.className='state dirty';st.innerHTML='<i></i>輸入中…';clearTimeout(tm);tm=setTimeout(save,600)}));
  $('#n-proj').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(!v)return;const pid=resolveProject(v);if(!n.projectIds.includes(pid))n.projectIds.push(pid);save();render()}})};

/* 假勤額度：法定週年基準僅供估算，正式核給以公司紀錄為準 */
function leaveLedger(){return db.leaveLedger||(db.leaveLedger=[])}
function leaveGrantDays(years){if(years<.5)return 0;if(years<1)return 3;if(years<2)return 7;if(years<3)return 10;if(years<5)return 14;if(years<10)return 15;return Math.min(30,16+Math.floor(years)-10)}
function anniversaryYears(hire,day){if(!hire||!day)return null;if(day<hire)return 0;
  let n=+day.slice(0,4)-+hire.slice(0,4);if(day.slice(5)<hire.slice(5))n--;
  const last=addYears(hire,n),next=addYears(hire,n+1);return n+diffD(last,day)/Math.max(1,diffD(last,next))}
function leavePeriod(anchor,asOf){if(!/^\d{4}-\d{2}-\d{2}$/.test(anchor||''))return null;let st=anchor;let n=0;while(addYears(st,1)<=asOf&&n++<150)st=addYears(st,1);while(st>asOf&&n++<300)st=addYears(st,-1);return[st,addD(addYears(st,1),-1)]}
function addYears(d,n){const y=+d.slice(0,4)+n,m=+d.slice(5,7),dd=+d.slice(8);return iso(new Date(y,m-1,Math.min(dd,new Date(y,m,0).getDate())))}
function hoursUsed(type,start,end){return sum(Object.entries(db.days).filter(([d])=>d>=start&&d<=end),([d,v])=>sum((v.leaves||[]).filter(x=>x.type===type),x=>+x.hours||0))}
function leaveSummary(asOf){const s=db.settings,cycle=leavePeriod(s.leaveCycleStart||s.hireDate,asOf);const st=cycle?.[0]||`${asOf.slice(0,4)}-01-01`,ed=cycle?.[1]||`${asOf.slice(0,4)}-12-31`;const years=anniversaryYears(s.hireDate,st);const sixMonths=s.hireDate?(()=>{const a=new Date(s.hireDate+'T12:00:00');const b=new Date(a);b.setMonth(b.getMonth()+6);return iso(b)})():null;const estimate=years==null?null:(years>=1?leaveGrantDays(years):(sixMonths&&asOf>=sixMonths?3:0));const grant=s.leaveGrantedHours===''||s.leaveGrantedHours==null?null:+s.leaveGrantedHours;const special=hoursUsed('特休',st,asOf);const adjust=sum(leaveLedger().filter(x=>x.type==='特休'&&x.date>=st&&x.date<=asOf),x=>x.hours);const available=grant==null?null:grant+adjust;
 const compEarned=sum(leaveLedger().filter(x=>x.type==='補休'&&x.date<=asOf),x=>x.hours);const compUsed=hoursUsed('補休','1900-01-01',asOf);const compDebits=sum(leaveLedger().filter(x=>x.type==='補休結清'&&x.date<=asOf),x=>x.hours);return{st,ed,estimate,years,grant,available,special,compEarned,compUsed,compDebits,compBalance:compEarned-compUsed-compDebits}}

function leavePlans(){return db.leavePlans||(db.leavePlans=[])}

function planDates(a,b){let out=[];if(!/^\d{4}-\d\d-\d\d$/.test(a||'')||!/^\d{4}-\d\d-\d\d$/.test(b||'')||b<a)return out;

function leavePlanProjection(){
 const now=today(),z=leaveSummary(now),hrs=hpd(),periodStart=z.st,periodEnd=z.ed,next=addD(periodEnd,1);
 const grant=z.available==null?null:leaveMinutes(z.available);
 const used=leaveMinutes(hoursUsed('特休',periodStart,now));
 const futureOfficial=leaveMinutes(hoursUsed('特休',addD(now,1),periodEnd));
 const planned=leavePlans().filter(p=>p.start<=periodEnd&&p.end>=periodStart).sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));
 const events=new Map(),warnings=[];
 const dateSet=new Map();
 // 正式請假已寫入當日日誌，永遠先扣正式紀錄
 for(const [d,day] of Object.entries(db.days))if(d>now&&d<=periodEnd){const m=officialLeaveMin(d);if(m)events.set(d,{date:d,official:m,sim:0,conflict:0,items:[]})}
 for(const p of planned){const dates=planDates(p.start,p.end);if(!dates.length)continue;
  const pm=leaveMinutes(p.hours);for(const d of dates){if(d<periodStart||d>periodEnd)continue;
   if(d<now)continue; // 已經過去的模擬不會再次耗用目前可用額度
   const event=events.get(d)||{date:d,official:d>now?officialLeaveMin(d):0,sim:0,conflict:0,items:[]};
   const taken=(dateSet.get(d)||0),capacity=Math.max(0,leaveMinutes(hrs)-officialLeaveMin(d)-taken),usable=Math.min(pm,capacity);

 }
 const timeline=[...events.values()].sort((a,b)=>a.date.localeCompare(b.date));

 for(const row of timeline){if(bal!==null){bal-=row.official+row.sim;if(bal<0&&!firstShort)firstShort=row.date}}

}

  const accChart=`${accuracyCats.length?'<div class="hb">':'<div class="sub">尚無可比較的預估與實際工時資料</div><div class="hb">'}${accuracyCats.map(c=>{const x=s.acc[c];const r=x.e?x.a/x.e:null;return`<div class="hbr" style="cursor:default"><span class="lb">${c}</span><span class="tr" style="position:relative">${r?`<i style="width:${Math.min(100,r/2*100)}%;background:${r>1.25?'var(--late)':r<.8?'var(--plan)':'var(--done)'}"></i>`:''}<span style="position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--fg-3)"></span></span><span class="v">${r?'×'+r.toFixed(2):'—'}</span></div>`}).join('')}</div><p class="sub" style="margin:8px 0 0">實際 ÷ 預估；虛線＝1.0（剛好），超過代表低估。</p>`;
  const accT=tbl(['分類','預估','實際','倍率','筆數'],accuracyCats.map(c=>{const x=s.acc[c];return[c,fh(x.e),fh(x.a),x.e?'×'+(x.a/x.e).toFixed(2):'—',x.n]}));
  // 延遲

  const officeYears=[...new Set([...Object.keys(db.days).map(d=>d.slice(0,4)),new Date().getFullYear().toString(),S.officeYear].filter(y=>/^\d{4}$/.test(y)))].sort((a,b)=>b.localeCompare(a));
  const oy=S.officeYear,om=S.officeMonth,officeAnnual=S.officePeriod==='year';
  const ofrom=officeAnnual?`${oy}-01-01`:`${oy}-${om}-01`;

  const os=calcStats(ofrom,oto);
  const locT=tbl(['地點','天數'],Object.entries(os.locs).filter(([name])=>name.trim()).sort(by(x=>x[1],-1)).map(([name,count])=>[esc(name),count]));
  const officeDates=Object.keys(db.days).filter(d=>d>=ofrom&&d<=oto&&(db.days[d].locations||[]).some(x=>x.place?.trim()));
  const officeDays=new Set(officeDates).size;
  const officeControl=`<div class="row" style="margin:8px 0 12px;align-items:center;gap:8px;flex-wrap:wrap">
    <div class="seg"><button type="button" data-office-period="month" aria-pressed="${!officeAnnual}">月統計</button><button type="button" data-office-period="year" aria-pressed="${officeAnnual}">年統計</button></div>
    <select aria-label="辦公地統計年份" id="office-year" style="width:auto;min-width:92px">${officeYears.map(y=>`<option value="${y}" ${oy===y?'selected':''}>${y} 年</option>`).join('')}</select>
    ${officeAnnual?'':`<select aria-label="辦公地統計月份" id="office-month" style="width:auto;min-width:82px">${Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=>`<option value="${m}" ${om===m?'selected':''}>${+m} 月</option>`).join('')}</select>`}
  </div>`;
  const officeSummary=`<p class="sub" style="margin:8px 0 0">${oy} 年${officeAnnual?'':` ${+om} 月`}｜有辦公地紀錄 ${officeDays} 天｜出差 ${os.trips} 天</p><p class="sub" style="margin:4px 0 0">同一天不同地點各計 1 天；出差天數依日期去重，因此各地點天數加總可能超過實際出勤天數。</p>`;
  return head+kpis+`<div class="grid g2">
    ${chartCard('series','工時走勢',series,seriesT)}
    ${chartCard('proj','專案工時排行（哪件事做最多）',projChart,projT)}
    ${chartCard('cat','分類佔比',catChart,catT)}
    ${chartCard('acc','估時準確度',accChart,accT)}
    ${chartCard('delay','延遲原因',delChart,delT,`<span class="sub">共 ${s.delays.n} 次</span>`)}
    <div class="card pv"><h3 style="margin-bottom:8px">加班與補休</h3><dl class="kv"><dt>無償加班</dt><dd>${fh(s.unpaid)}hr</dd><dt>申報加班</dt><dd>${fh(s.decl)}hr</dd><dt>轉補休（本期）</dt><dd>${fh(s.comp)}hr</dd>
      <dt>${to.slice(0,4)} 私記轉補休</dt><dd>${fh(s.compEarned)}hr <span class="sub">待公司核給</span></dd><dt>${to.slice(0,4)} 補休已用</dt><dd>${fh(s.compUsed)}hr</dd><dt>補休帳面餘額</dt><dd><b>${fh(leaveSummary(today()).compBalance)}hr</b> <span class="sub">依假勤頁核給紀錄</span></dd></dl></div>
    <div class="card pv"><div class="row"><h3 style="margin-bottom:8px">請假</h3><span class="sp"></span><button class="btn sm" data-act="go" data-p="leave">假勤額度管理 ›</button></div><div class="tbl-wrap">${lvT}</div></div>
    <div class="card pv"><h3 style="margin-bottom:8px">辦公地／出差｜年月查詢</h3>${officeControl}<div class="tbl-wrap">${locT}</div>${officeSummary}</div>
  </div>`}

function drill(q){const from=q.from,to=q.to;let ts=T().filter(t=>t.date&&t.date>=from&&t.date<=to&&t.status!=='待辦');let title='明細';let ots=[];
  if(q.type==='project'){ts=ts.filter(t=>q.id==='_none'?false:t.projectId===q.id);ots=db.ot.filter(o=>o.date>=from&&o.date<=to&&(o.projectId||'_none')===q.id);title=`${q.id==='_none'?'未對應專案':pname(q.id)}｜明細`}
  if(q.type==='cat'){ts=ts.filter(t=>t.category===q.id);title=`${q.id}｜明細`}
  if(q.type==='delay'){ts=ts.filter(t=>t.status==='延遲'&&(!q.tag||(t.delayReasonTag||'未填')===q.tag));title='延遲明細'}
  if(q.type==='ontime'){ts=T().filter(t=>t.status==='已交付'&&t.dl&&(t.deliveredAt||t.date)>=from&&(t.deliveredAt||t.date)<=to);title='有 DL 的交付'}
  if(q.type==='ot'){ts=[];ots=db.ot.filter(o=>o.date>=from&&o.date<=to);title='加班明細'}
  if(q.type==='all'){ots=db.ot.filter(o=>o.date>=from&&o.date<=to)}
  ts.sort(by(t=>t.date));
  const body=`<div class="sub">${from} ～ ${to}・任務 ${ts.length} 筆・辦公室 ${fh(sum(ts,t=>t.actual?.office))}hr${ots.length?`・加班 ${fh(sum(ots,o=>o.hours))}hr`:''}</div>
  ${ts.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>日期</th><th>專案</th><th>任務</th><th class="n">預估</th><th class="n">實際</th><th>狀態</th>${q.type==='ontime'?'<th>DL</th><th>交付日</th>':''}${q.type==='delay'?'<th>原因</th>':''}</tr></thead><tbody>
  ${ts.map(t=>`<tr data-act="task" data-id="${t.id}" style="cursor:pointer"><td class="num">${t.date}</td><td>${esc(pname(t.projectId))}</td><td>${esc(t.title)}</td><td class="n">${fh(t.estHours)}</td><td class="n">${fh(t.actual?.office)}</td><td><span class="chip ${STCLS[t.status]}">${t.isUrgent?'突發':t.status}</span></td>${q.type==='ontime'?`<td class="num">${t.dl}</td><td class="num">${t.deliveredAt||t.date}${(t.deliveredAt||t.date)<=t.dl?'':' <span class="chip late">逾期</span>'}</td>`:''}${q.type==='delay'?`<td>${esc(t.delayReasonTag||'未填')}${t.delayReasonText?'：'+esc(t.delayReasonText):''}</td>`:''}</tr>`).join('')}</tbody></table></div>`:''}
  ${ots.length?`<h3>加班</h3><div class="tbl-wrap pv"><table class="t"><thead><tr><th>日期</th><th>類型</th><th>內容</th><th>專案</th><th class="n">hr</th></tr></thead><tbody>${ots.map(o=>`<tr><td class="num">${o.date}</td><td>${o.type}</td><td>${esc(o.text)}</td><td>${esc(o.projectId?pname(o.projectId):'—')}</td><td class="n">${fh(o.hours)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  openModal({title,body,wide:true,foot:'<button class="btn" data-act="mclose">關閉</button>'})}
