let historyPack=null,historyChoices={};
function historyExportDays(){const days=Object.keys(db.days).sort(),a=days.map(d=>({date:d,text:db.days[d].rawText||''}));const blob=new Blob([JSON.stringify({format:'workcal-history-export-v1',records:a},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const b=document.createElement('a');b.href=u;b.download=`workcal-history-${today()}.json`;b.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
/* 歷史匯入：只出現在「今日工作項目」、之後沒有回報的過去項目，視為推定完成並標記 */
function inferHistoryDone(dates){const set=new Set(dates),t0=today();let n=0;
  for(const t of T()){if(!set.has(t.date)||t.origin!=='plan'||t.status!=='規劃'||t.date>=t0)continue;
    t.status='完成';t.inferred=true;t.note=(t.note?t.note+'；':'')+'推定完成（匯入時無回報）';t.subItems=(t.subItems||[]).map(x=>Object.assign({},x,{status:'完成'}));n++}
  return n}
/* 歷史匯入：由匯入產生、日期在今天以前的待辦／延續項目一律封存（仍可在「封存」還原） */
function archiveHistoryTodos(dates){const set=new Set(dates),t0=today();let n=0;
  for(const t of T()){if(t.archived||!(t.source==='todo'||t.source==='carry'))continue;
    const fromImport=set.has(t.createdByDay)||set.has(t.date);if(!fromImport)continue;
    if(t.date&&t.date>=t0)continue;
    if(t.status==='規劃'||t.status==='待辦'){t.status='完成';t.inferred=true;t.note=(t.note?t.note+'；':'')+'推定完成（匯入時無回報）'}
    t.archived=true;n++}
  return n}
/* 歷史匯入後整理專案：分類取多數決（不看突發），超過 60 天沒有紀錄的專案自動結案 */
function finalizeHistoryProjects(){const t0=today(),cut=addD(t0,-60);let closed=0;
  for(const p of Object.values(db.projects)){const ts=T().filter(t=>t.projectId===p.id);
    const cnt={};ts.filter(t=>t.category&&t.category!=='突發').forEach(t=>cnt[t.category]=(cnt[t.category]||0)+1);
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(top)p.category=top[0];
    const last=ts.filter(t=>t.date).map(t=>t.date).sort().pop();
    const pending=ts.some(t=>!t.archived&&['待辦','規劃'].includes(t.status)&&(!t.date||t.date>=t0));
    if(p.status==='進行中'&&last&&last<cut&&!pending){p.status='結案';p.closedAt=last;closed++}}
  return closed}

 openModal({title:'歷史日誌匯入｜先預覽再確認',wide:true,body:`<p class="sub">請選擇使用 OneNote 轉換工具產生的 <b>workcal-history-v1 JSON</b>。原始 Word 請先使用隨附的轉換工具處理。<b>既有日期預設略過</b>；含私記的版本也會匯入（私記只存在你的資料內，不進 Teams 匯出）。匯入前建議下載完整 JSON 備份。</p><div class="row"><input id="hist-file" type="file" accept=".json,application/json"><button class="btn" id="hist-backup">先下載完整備份</button><button class="btn" id="hist-export">匯出所有日誌 JSON</button></div><div id="hist-results" class="stack" style="margin-top:12px"><span class="sub">尚未選擇匯入檔</span></div>`,foot:`<button class="btn" data-act="mclose">取消</button><button class="btn pri" id="hist-commit" disabled>確認匯入選定日期</button>`,onMount:ov=>{

    });
  };
  $('#hist-file',ov).onchange=e=>{if(e.target.files[0])read(e.target.files[0])};

function splitImport(text,startYear){
  const lines=String(text||'').split(/\r?\n/);const chunks=[];let cur=null;
  const dre=/^\s*(?:小馬)?\s*(?:(\d{4})\s*[-\/.年]\s*)?(\d{1,2})\s*[\/月.]\s*(\d{1,2})\s*日?(?=$|\s|[（(]|[^\d\/])/;
  for(const l of lines){const m=N(l).match(dre);const rest=m?N(l).slice(m[0].length).trim():'';
    const looksDate=m&&+m[2]>=1&&+m[2]<=12&&+m[3]>=1&&+m[3]<=31&&(!rest||/今日|昨日|定案|工作|^[（(]/.test(rest));
    if(looksDate){cur={y:m[1]?+m[1]:null,m:+m[2],d:+m[3],head:l,lines:[]};chunks.push(cur);if(rest&&/今日|昨日/.test(rest))cur.lines.push(N(l).slice(m[0].length));}
    else if(cur)cur.lines.push(l)}
  let y=+startYear,pm=null;
  for(const c of chunks){
    c.warn=[];
    if(c.y){y=c.y}else{if(pm!=null&&c.m<pm){if(pm-c.m>=6)y++;else c.warn.push('月份比前一筆早（順序倒退），沿用同年')}c.y=y}
    pm=c.m;
    const body=c.lines.join('\n');const clue=[...body.matchAll(/(?<!\d)(11[2-9])(?:年|Q[1-4]|(0[1-9]|1[0-2])(?!\d))/g)].map(x=>+x[1]+1911);
    if(clue.length&&!clue.includes(c.y)){c.warn.push(`內容線索指向 ${[...new Set(clue)].join('/')} 年`);c.conflict=true}
    c.date=`${c.y}-${pad(c.m)}-${pad(c.d)}`;
    if(isNaN(pd(c.date))||pd(c.date).getMonth()+1!==c.m){c.warn.push('日期無效');c.bad=true}
    c.text=`日期：${c.date}（${wd(c.date)}）\n姓名：${db.settings.displayName}\n${body.trim()}`;
    const r=parseDay(c.text);c.items=r.today.length+r.done.length+r.undone.length+r.urgent.length;c.errs=r.warnings.filter(w=>w.level==='err').length;
    c.exist=!!db.days[c.date]?.rawText;c.action=c.exist?'skip':'write'}
  return chunks}

/* ---------- 工作風險與情境決策 V2 (純規則、模擬不改正式資料) ---------- */
const RANK={'低':1,'中':2,'高':3},RLEVEL=['一般','黃色','橘色','紅色'];
let riskDraft=null,riskHorizon=7;
function riskRecord(t){const r=t.riskProfile||{};return {importance:r.importance||'',impact:r.impact||'',likelihood:r.likelihood||''}}
function riskOpen(t){return !t.archived&&!['完成','已交付','放棄'].includes(t.status)}
function riskRemaining(t){let est=Number(t.estHours);if(!Number.isFinite(est)||t.estHours==null)return null;
 const actual=Number(t.actual?.office);return Math.max(0,est-(t.actual?.office!=null&&Number.isFinite(actual)?actual:0))}
function riskCapacity(a,b){if(b<a)return 0;let n=0;for(let d=a;d<=b;d=addD(d,1)){if(isWorkday(d)){const day=db.days[d],leave=(day?.leaves||[]).reduce((sum,l)=>sum+(Number(l.hours)||0),0);n+=Math.max(0,hpd()-leave)}}return Math.round(n*10)/10}
function assessRisk(t){const r=riskRecord(t),pending=Object.values(r).some(v=>!RANK[v]),remain=riskRemaining(t),dl=t.dl||null,days=dl?diffD(today(),dl):null;
 const isLate=days!==null&&days<0;let score=(RANK[r.importance]||0)+(RANK[r.impact]||0)*2+(RANK[r.likelihood]||0)*2;
 const why=[];if(pending)why.push('風險維度尚未完整評估');
 if(isLate){score+=4;why.push('已逾期 '+Math.abs(days)+' 天')}
 else if(days!==null&&days<=2){score+=3;why.push('距截止日 '+days+' 天')}
 else if(days!==null&&days<=7){score+=1;why.push('7 天內到期')}
 else if(!dl)why.push('未設定 DL，仍依影響與可能性評估');
 if(r.impact==='高')why.push('未完成影響高');
 if(r.likelihood==='高')why.push('無法如期完成可能性高');
 if(remain===null)why.push('剩餘工時未知，排程判讀受限');
 let capacity=null;if(dl&&days!==null&&days>=0){capacity=riskCapacity(today(),dl);if(remain!==null&&remain>capacity){score+=4;why.push('剩餘 '+remain+'h，大於期限前全部可用 '+capacity+'h')}}
 if(t.date&&dl&&t.date>dl){score+=3;why.push('排入日期晚於截止日')}
 const level=Math.max(score>=15?3:score>=11?2:score>=7?1:0,r.impact==='高'?2:0);
 const advice=[];if(isLate)advice.push('確認交付影響並重新排程或向相關人員協調');
 if(r.impact==='高')advice.push('優先核實影響範圍及對其他工作的相依關係');
 if(remain!==null&&capacity!==null&&remain>capacity)advice.push('工時缺口 '+(remain-capacity).toFixed(1)+'h，需調整順序、範圍或取得支援');
 if(!dl)advice.push('確認是否需要管理期限或設定下次追蹤日');
 if(!advice.length)advice.push('依既有排程追蹤，確認風險維度及進度');
 return {t,r,pending,remain,days,isLate,score,level,why,advice,capacity}}
function allRisk(){return T().filter(riskOpen).map(assessRisk).sort((a,b)=>b.level-a.level||b.score-a.score)}
function riskStatusText(t){return t.riskState?.status||'尚未處理'}
function riskAction(id){const t=db.tasks[id];if(!t)return;const z=t.riskState||{};
 openModal({title:'風險處理｜'+esc(t.title),body:`<div class="stack"><label class="fl">處理方式<select id="rk-status">${['尚未處理','立即處理','重新安排','等待他人回覆','已向主管反映','接受風險','風險已解除'].map(x=>`<option ${z.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="fl">追蹤日期<input id="rk-date" type="date" value="${z.followUp||''}"></label><label class="fl">措施、原因及後續結果<textarea id="rk-note" rows="6">${esc(z.note||'')}</textarea></label><p class="sub">接受風險不代表完成；解除後仍保留原歷程。此操作不修改任務完成狀態。</p></div>`,foot:'<button class="btn" data-act="mclose">取消</button><button class="btn pri" id="rk-save">儲存風險紀錄</button>',onMount:ov=>{$('#rk-save',ov).onclick=()=>{const status=$('#rk-status',ov).value,note=$('#rk-note',ov).value.trim(),followUp=$('#rk-date',ov).value;const before=t.riskState||{};t.riskHistory=t.riskHistory||[];if(before.status!==status||before.note!==note||before.followUp!==followUp)t.riskHistory.push({at:new Date().toISOString(),from:before.status||'尚未處理',to:status,note,followUp});t.riskState={status,note,followUp,updatedAt:new Date().toISOString()};persist();closeModal();render();toast('風險紀錄已儲存')}}})}
function riskAvailableWindow(days){let d=today(),end=addD(d,days-1);return riskCapacity(d,end)}
function riskModels(){const all=allRisk(),cap=riskAvailableWindow(riskHorizon);const byRisk=[...all].sort((a,b)=>b.score-a.score);const byDl=[...all].sort((a,b)=>(a.t.dl||'9999').localeCompare(b.t.dl||'9999'));const byShort=[...all].sort((a,b)=>(a.remain??999)-(b.remain??999));return [{key:'critical',label:'A｜優先高風險',order:byRisk},{key:'deadline',label:'B｜優先近期 DL',order:byDl},{key:'short',label:'C｜優先可完成工作',order:byShort},{key:'support',label:'D｜假設增加支援 4h',order:byRisk,capacity:cap+4}].map(m=>{let left=m.capacity??cap,done=[],late=[],unknown=[];for(const x of m.order){if(x.remain===null){unknown.push(x.t.title);continue}if(x.remain<=left){left-=x.remain;done.push(x.t.id)}else late.push(x.t.id)}return {...m,cap:m.capacity??cap,done,late,unknown,left:Math.round(left*10)/10,shortage:Math.round(Math.max(0,m.order.reduce((n,x)=>n+(x.remain||0),0)-(m.capacity??cap))*10)/10}})}

 const changes=[];let date=today();for(const t of order){while(!isWorkday(date))date=addD(date,1);changes.push({id:t.id,title:t.title,old:t.date||'未排日',date});date=addD(date,1)}

function riskTrendRows(){const byMonth={};for(const t of T()){const d=t.deliveredAt||t.date||t.updatedAt&&new Date(t.updatedAt).toISOString().slice(0,10)||null;if(!d)continue;const m=d.slice(0,7);(byMonth[m]??=[]).push(t)}return Object.keys(byMonth).sort().reverse().slice(0,12).map(m=>{const a=byMonth[m],over=a.filter(t=>t.dl&&t.deliveredAt&&t.deliveredAt>t.dl).length;const delayed=a.filter(t=>t.dl&&t.deliveredAt&&t.deliveredAt>t.dl).map(t=>diffD(t.dl,t.deliveredAt));return {month:m,total:a.length,over,mean:delayed.length?(delayed.reduce((n,v)=>n+v,0)/delayed.length).toFixed(1):'—'}})}
function pgRisk(){const all=allRisk(),red=all.filter(x=>x.level===3),late=all.filter(x=>x.isLate),soon=all.filter(x=>x.days!==null&&x.days>=0&&x.days<=7),pending=all.filter(x=>x.pending),cap=riskAvailableWindow(7),total=all.reduce((n,x)=>n+(x.remain||0),0),models=riskDraft||riskModels();return `<div class="pagehead"><h1>工作風險與決策</h1><p class="sub">依既有待辦與工時資料計算；風險、預測及情境模擬皆可追溯。決策由你確認。</p></div><div class="risk-kpis"><div class="risk-stat"><span>高風險</span><b>${red.length}</b></div><div class="risk-stat"><span>7 天內到期</span><b>${soon.length}</b></div><div class="risk-stat"><span>已逾期</span><b>${late.length}</b></div><div class="risk-stat"><span>本週工時缺口（估）</span><b>${Math.max(0,total-cap).toFixed(1)}h</b></div></div>
 <div class="card stack"><div class="row"><h2>今日最值得關注</h2><span class="sub">待評估 ${pending.length} 項｜未有 DL 也納入</span></div>${all.length?all.slice(0,5).map(x=>`<div class="risk-line"><span class="risk-light r${x.level}">${RLEVEL[x.level]}</span><span style="flex:1"><b>${esc(x.t.title)}</b><small>${esc(x.why.join('；'))}</small></span><button class="btn sm" data-act="riskedit" data-id="${x.t.id}">開啟原待辦</button></div>`).join(''):'<p class="sub">目前沒有進行中的待辦。</p>'}</div>
 <div class="card stack"><h2>風險清單與處理追蹤</h2>${all.length?all.map(x=>`<div class="risk-item"><div class="row" style="gap:10px;flex-wrap:wrap"><span class="risk-light r${x.level}">${RLEVEL[x.level]}</span><b style="flex:1">${esc(x.t.title)}</b><button class="btn sm" data-act="riskedit" data-id="${x.t.id}">編輯任務</button><button class="btn sm" data-act="riskaction" data-id="${x.t.id}">處理／追蹤</button></div><p class="sub">${esc(pname(x.t.projectId))}｜DL ${x.t.dl||'未設定'}｜剩餘 ${x.remain===null?'未知':x.remain+'h'}｜${x.pending?'待評估':'已評估'}｜${esc(riskStatusText(x.t))}</p><p class="sub">原因：${esc(x.why.join('；'))}</p><p class="sub">建議：${esc(x.advice.join('；'))}</p>${x.t.riskHistory?.length?`<details><summary>處理歷程（${x.t.riskHistory.length} 筆）</summary>${x.t.riskHistory.map(h=>`<p class="sub">${esc(h.at.slice(0,16))} ${esc(h.from)} → ${esc(h.to)} ${esc(h.note||'')}</p>`).join('')}</details>`:''}</div>`).join(''):'<p class="sub">無進行中風險。</p>'}</div>

function searchAll(q){q=q.trim();if(!q)return[];const out=[];const has=s=>String(s||'').toLowerCase().includes(q.toLowerCase());
  T().forEach(t=>{if(has(t.title)||has(pname(t.projectId))||(t.subItems||[]).some(s=>has(s.text))||has(t.delayReasonText)||has(t.outcome)||has(t.doneText)||has(t.deliverTo))out.push({g:'任務',l:`${t.date?md(t.date)+' ':''}${pname(t.projectId)}｜${t.title}`,act:['task',t.id]})});

/* ---------- 雲端同步（Firebase Auth＋Firestore） ----------
   資料結構：users/{uid}/{集合}/{文件}
   - days、tasks、projects、notes、reviews、teamsConfirmed、weekly：一筆一份文件
   - 其他（settings、ot、leaveLedger、leavePlans…）：meta/k_{名稱}
   文件內容：{ j: JSON 字串, d: 是否刪除, u: 伺服器時間 }。只抓 u 比上次新的文件，省讀取額度。
   合併：以「上次同步時的版本」做三方比對；兩邊都改過時，保留 updatedAt 較新的一方，另一方存到衝突備份。 */

    if(SYNC_MAP.includes(k)&&v&&typeof v==='object'&&!Array.isArray(v)){for(const id of Object.keys(v)){if(v[id]!==undefined)out[k+'/'+id]=JSON.stringify(v[id])}}

    error:'同步失敗：'+SYNC.msg,offline:'雲端元件無法載入（離線？）資料仍存在本機',choose:'等待你選擇合併方式'}[SYNC.status]||''}
function syncNavHTML(){const c={synced:'var(--done)',syncing:'var(--plan)',loading:'var(--plan)',error:'var(--late)',offline:'var(--pend)',off:'var(--pend)',choose:'var(--pend)'}[SYNC.status]||'var(--none)';

/* 收到雲端變更：三方比對後套用 */
function syncMerge(list){const st=SYNC.state,local=syncDocs();let changed=false,conflicts=0;
  for(const c of list){const path=c.path,rj=c.j,rh=rj==null?null:syncHash(rj);
    if(c.uMs&&c.uMs>st.since)st.since=c.uMs;

    if(rh===sh)continue; // 雲端沒變，本機較新，稍後上傳

    conflicts++;

    if(lj===null){syncApply(path,rj);st.h[path]=rh;changed=true;continue} // 本機刪了、雲端改了：保留資料
    if(syncUpdatedAt(rj)>=syncUpdatedAt(lj)){syncSaveConflict(path,lj);syncApply(path,rj);st.h[path]=rh;changed=true}
    else{syncSaveConflict(path,rj);st.h[path]=rh}}

  if(changed){try{rebindDb()}catch(e){}HOL_SRC=null;syncRawSave();applyTheme();syncRender()}

/* 上傳本機變更 */
function syncSchedule(){if(!SYNC.uid||!SYNC.ready)return;clearTimeout(SYNC.pushT);SYNC.pushT=setTimeout(syncPush,1500)}

        try{await SYNC.api.resetPassword(em);const m=$('#lg-msg',ov);m.style.color='';m.textContent='已寄出重設密碼信到 '+em+'，請到信箱收信（也看一下垃圾郵件）'}catch(e){msg(loginErr(e))}}}})}
function loginErr(e){const c=e&&e.code||'';
  return ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)?'Email 或密碼不正確':
    c==='auth/invalid-email'?'Email 格式不正確':c==='auth/too-many-requests'?'嘗試太多次，請稍後再試或用忘記密碼':
    c==='auth/network-request-failed'?'連不上網路':c==='auth/operation-not-allowed'?'Firebase 尚未啟用「電子郵件/密碼」登入':'登入失敗：'+(c||e?.message||e)}
function syncStop(){SYNC.unsubs.forEach(u=>{try{u()}catch(e){}});SYNC.unsubs=[];SYNC.ready=false;SYNC.uid=null;clearTimeout(SYNC.pushT);clearTimeout(SYNC.retryT)}
function cloudBoot(){
  const attach=api=>{SYNC.api=api;api.onAuth(user=>{if(user)syncStart(user);else{syncStop();syncSetStatus('off')}});
    window.addEventListener('online',()=>{if(SYNC.uid)syncPush()})};
  if(window.WorkCalCloud)attach(window.WorkCalCloud);
  else{window.addEventListener('cloud-ready',()=>attach(window.WorkCalCloud),{once:true});
    window.addEventListener('cloud-failed',()=>syncSetStatus('offline'),{once:true});
    setTimeout(()=>{if(!SYNC.api)syncSetStatus('offline')},15000)}}

/* ---------- 輸入加強：日期／時間可直接打字＋下拉選，分類／假別可打字＋下拉 ----------
   原本的欄位保留（隱藏），所有既有程式照常讀寫它；畫面上換成可打字的欄位，兩邊自動同步。 */
const ENH_COMBO='#tf-cat,#gd-cat,#wk-cat,#fx-c,#pe-c,#lv-type,[data-gurgent][data-ufield="category"],[data-gleave][data-gfield="type"]';
const ENH_CAT='#tf-cat,#gd-cat,#wk-cat,#fx-c,#pe-c,[data-gurgent][data-ufield="category"]';
function fw2hw(s){return String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[／．。、－]/g,'/').replace(/：/g,':').trim()}
function parseDateText(raw,ref){let s=fw2hw(raw);if(!s)return '';ref=ref||today();
  if(/^(今天|今日)$/.test(s))return today();if(/^(明天|明日)$/.test(s))return addD(today(),1);if(/^(昨天|昨日)$/.test(s))return addD(today(),-1);
  s=s.replace(/[年月]/g,'/').replace(/日/g,'').replace(/[\s.\-]+/g,'/').replace(/\/+/g,'/').replace(/^\/|\/$/g,'');
  let y,m,d,p=s.split('/');
  if(p.length===1){const n=p[0];if(!/^\d+$/.test(n))return null;
    if(n.length===8){y=+n.slice(0,4);m=+n.slice(4,6);d=+n.slice(6)}
    else if(n.length===7){y=+n.slice(0,3)+1911;m=+n.slice(3,5);d=+n.slice(5)}
    else if(n.length===6){y=2000+ +n.slice(0,2);m=+n.slice(2,4);d=+n.slice(4)}
    else if(n.length===4||n.length===3){y=+ref.slice(0,4);m=+n.slice(0,n.length-2);d=+n.slice(-2)}
    else return null}
  else if(p.length===2){y=+ref.slice(0,4);m=+p[0];d=+p[1]}
  else if(p.length===3){y=+p[0];m=+p[1];d=+p[2];if(p[0].length===3||(y>=100&&y<1000))y+=1911;else if(p[0].length<=2)y+=2000}
  else return null;
  if(!(y>=1900&&y<=2200&&m>=1&&m<=12&&d>=1&&d<=31))return null;
  const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)return null;return iso(dt)}
function parseTimeText(raw){let s=fw2hw(raw).replace(/[點时時]/g,':').replace(/分/g,'').replace(/\s/g,'');if(!s)return '';
  let h,mi,m=s.match(/^(\d{1,2}):(\d{1,2})$/);if(m){h=+m[1];mi=+m[2]}
  else if(/^\d{3,4}$/.test(s)){h=+s.slice(0,s.length-2);mi=+s.slice(-2)}else if(/^\d{1,2}$/.test(s)){h=+s;mi=0}else return null;
  if(h>23||mi>59)return null;return pad(h)+':'+pad(mi)}
function enhHook(orig,onSet){const proto=Object.getPrototypeOf(orig),desc=Object.getOwnPropertyDescriptor(proto,'value');
  Object.defineProperty(orig,'value',{configurable:true,get(){return desc.get.call(this)},set(v){desc.set.call(this,v);onSet()}})}
function enhFire(el){el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
function enhDateTime(orig){const isTime=orig.type==='time';orig.dataset.enh='1';
  const wrap=document.createElement('span');wrap.className='enh-wrap';
  const t=document.createElement('input');t.type='text';t.className=orig.className;t.inputMode='numeric';t.autocomplete='off';
  t.placeholder=isTime?'例：0830、8:30':'例：1021、10/21、115/10/21';if(orig.getAttribute('aria-label'))t.setAttribute('aria-label',orig.getAttribute('aria-label'));
  if(orig.style.width)t.style.width=orig.style.width==='auto'?(isTime?'7em':'10.5em'):orig.style.width;
  if(isTime){const id='dl'+uid();const dl=document.createElement('datalist');dl.id=id;for(let h=7;h<=21;h++)for(const mm of ['00','30'])dl.insertAdjacentHTML('beforeend',`<option value="${pad(h)}:${mm}">`);t.setAttribute('list',id);wrap.appendChild(dl)}
  const b=document.createElement('button');b.type='button';b.className='btn sm enh-pick';b.tabIndex=-1;b.setAttribute('aria-label',isTime?'選擇時間':'從月曆選日期');b.textContent=isTime?'🕘':'📅';
  orig.parentNode.insertBefore(wrap,orig);wrap.append(t,b,orig);orig.classList.add('enh-hidden');orig.tabIndex=-1;
  const show=()=>{t.value=orig.value||'';t.classList.remove('enh-bad')};show();enhHook(orig,show);
  const commit=()=>{const v=isTime?parseTimeText(t.value):parseDateText(t.value);
    if(v===null){t.classList.add('enh-bad');t.title='看不懂這個'+(isTime?'時間':'日期')+'，請重新輸入';return false}
    t.classList.remove('enh-bad');t.title='';if(v!==orig.value){Object.getOwnPropertyDescriptor(Object.getPrototypeOf(orig),'value').set.call(orig,v);t.value=v;enhFire(orig)}else t.value=v;return true};
  t.addEventListener('change',commit);t.addEventListener('blur',commit);
  t.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='ArrowDown'&&e.altKey){e.preventDefault();b.click()}});
  orig.addEventListener('change',show);orig.addEventListener('focus',()=>t.focus());
  b.addEventListener('click',()=>{commit();try{orig.showPicker()}catch(e){orig.focus();orig.click()}})}
function enhCombo(sel){sel.dataset.enh='1';const isCat=sel.matches(ENH_CAT);
  const wrap=document.createElement('span');wrap.className='enh-wrap';const id='dl'+uid();
  const dl=document.createElement('datalist');dl.id=id;
  const fill=()=>{dl.innerHTML=[...sel.options].map(o=>`<option value="${esc(o.textContent.trim())}">`).join('')};fill();
  const t=document.createElement('input');t.type='text';t.className=sel.className;t.setAttribute('list',id);t.autocomplete='off';
  t.placeholder='輸入或下拉選擇';if(sel.getAttribute('aria-label'))t.setAttribute('aria-label',sel.getAttribute('aria-label'));if(sel.style.width)t.style.width=sel.style.width==='auto'?'9em':sel.style.width;
  sel.parentNode.insertBefore(wrap,sel);wrap.append(t,dl,sel);sel.classList.add('enh-hidden');sel.tabIndex=-1;
  const show=()=>{const o=sel.options[sel.selectedIndex];t.value=o?o.textContent.trim():''};show();enhHook(sel,show);
  const commit=()=>{const v=t.value.trim();if(!v){show();return}
    let o=[...sel.options].find(x=>x.textContent.trim()===v||x.value===v);
    if(!o){if(isCat&&/[-｜|_\n]/.test(v)){toast('分類名稱不能含 - ｜ _ 符號');show();return}
      o=new Option(v,v);sel.add(o);fill();
      if(isCat&&!categories().includes(v)){db.settings.workCategories=[...(db.settings.workCategories||[]),v];persist();toast('已新增分類「'+v+'」')}}
    if(sel.value!==o.value){Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set.call(sel,o.value);enhFire(sel)}show()};
  t.addEventListener('change',commit);t.addEventListener('blur',commit);t.addEventListener('keydown',e=>{if(e.key==='Enter')commit()});
  t.addEventListener('focus',()=>{t.select()});sel.addEventListener('change',show);sel.addEventListener('focus',()=>t.focus())}
function enhanceInputs(root){(root||document).querySelectorAll('input[type="date"]:not([data-enh]),input[type="time"]:not([data-enh])').forEach(enhDateTime);
  (root||document).querySelectorAll('select:not([data-enh])').forEach(s=>{if(s.matches(ENH_COMBO))enhCombo(s)})}
new MutationObserver(()=>{if(enhanceInputs._q)return;enhanceInputs._q=true;queueMicrotask(()=>{enhanceInputs._q=false;enhanceInputs()})}).observe(document.body,{childList:true,subtree:true});
