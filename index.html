<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#009EAE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>工作日誌</title>
<style>
/* 版面：左導覽｜主內容｜右側待辦欄；手機為單欄＋底部導覽。記事本格線為每日頁的識別。 */
:root{
  --bg:#F4F8FD; --surface:#FFFFFF; --surface-2:#EAF3FA; --line:#D6E4F0; --line-2:#E9F0F6;
  --fg:#203149; --fg-2:#50647C; --fg-3:#74869A;
  --accent:#0A97D9; --accent-fg:#FFFFFF; --accent-soft:#DDF4FD;
  --plan:#1764A9; --plan-bg:#E9F3FF; --done:#277342; --done-bg:#E9F7EE;
  --late:#BA2339; --late-bg:#FFE8EC; --pend:#B84E10; --pend-bg:#FFF0E4;
  --none:#8795A7; --none-bg:#EDF1F5; --star:#A67C00; --priv:#8E2D78; --priv-bg:#FBEAFA;
  --rule:rgba(10,151,217,.09); --shadow:0 8px 28px rgba(28,78,132,.13);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas","Noto Sans Mono CJK TC","Microsoft JhengHei",ui-monospace,monospace;
  --nav-w:188px; --rail-w:300px; --lh:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#171d26; --surface-2:#1e2632; --line:#2b3543; --line-2:#232c38;
  --fg:#e3e7ee; --fg-2:#a6afbd; --fg-3:#6e7888;
  --accent:#26BDE2; --accent-fg:#091B2B; --accent-soft:#14354A;
  --plan:#6CBDF0; --plan-bg:#19334D; --done:#82CA76; --done-bg:#1A3528; --late:#FF7183; --late-bg:#42232E;
  --pend:#FFAC71; --pend-bg:#412C21; --none:#8595A8; --none-bg:#293443; --star:#FDD65E; --priv:#E29BD1; --priv-bg:#39243A;
  --rule:rgba(143,178,230,.065); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#171d26; --surface-2:#1e2632; --line:#2b3543; --line-2:#232c38;
  --fg:#e3e7ee; --fg-2:#a6afbd; --fg-3:#6e7888;
  --accent:#26BDE2; --accent-fg:#091B2B; --accent-soft:#14354A;
  --plan:#6CBDF0; --plan-bg:#19334D; --done:#82CA76; --done-bg:#1A3528; --late:#FF7183; --late-bg:#42232E;
  --pend:#FFAC71; --pend-bg:#412C21; --none:#8595A8; --none-bg:#293443; --star:#FDD65E; --priv:#E29BD1; --priv-bg:#39243A;
  --rule:rgba(143,178,230,.065); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* 內頁：左上 X、底部儲存列、手機隱藏底部導覽 */
.xbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none;font-size:20px;line-height:1;padding:0;color:var(--fg)}
.xbtn:hover{border-color:var(--fg-3)}
.xbtn.back{font-size:24px;padding-bottom:3px}
.savebar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.savebar .btn.pri{min-width:150px;justify-content:center;min-height:42px;font-size:15px}
.savebar .state{margin-right:auto}
#main.swiping{transition:none}
#main.swipe-back{transform:translateX(40px);opacity:.6;transition:transform .15s,opacity .15s}
@media (max-width:1023px){body.inner #bnav{display:none}body.inner #main{padding-bottom:0}.savebar .btn.pri{flex:1;min-height:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100%;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr) var(--rail-w)}
#nav{display:flex;flex-direction:column;gap:2px;padding:18px 12px 18px 0;border-right:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 16px}
.brand b{font-size:17px;letter-spacing:.04em}
.brand span{font-size:11px;color:var(--fg-3)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--fg-2);text-align:left}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .k{margin-left:auto;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.navbtn svg,.bn svg{width:18px;height:18px;flex:none}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px}
.syncstate{font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.syncstate i{width:7px;height:7px;border-radius:50%;background:var(--pend);display:inline-block}

#main{overflow-y:auto;overflow-x:hidden;min-width:0;padding:18px 22px 40px}
#rail{border-left:1px solid var(--line);overflow-y:auto;padding:18px 0 18px 16px;min-width:0;background:var(--bg)}
#bnav{display:none}
@media (max-width:1279px){
  #app{grid-template-columns:var(--nav-w) minmax(0,1fr)}
  #rail{position:fixed;top:0;bottom:0;right:0;width:min(340px,92vw);z-index:45;transform:translateX(105%);transition:transform .2s;
    box-shadow:var(--shadow);padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px}
  #rail.open{transform:none}
}
@media (max-width:1023px){
  #app{grid-template-columns:minmax(0,1fr)}
  #nav{display:none}
  #main{padding:14px 0 calc(78px + env(safe-area-inset-bottom,0px))}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--fg-3);font-size:11px;min-height:48px;justify-content:center;cursor:pointer}
  .bn[aria-current="page"]{color:var(--accent);font-weight:600}
}

/* 通用元件 */
h1{font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:15px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--fg-2);font-weight:600;letter-spacing:.06em}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ph .sp{flex:1}
.sub{color:var(--fg-3);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--fg-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
.btn.sm{padding:3px 8px;min-height:28px;font-size:12px}
.btn kbd{font-size:10px;opacity:.7}
@media (max-width:1023px){.btn{min-height:40px}.btn.sm{min-height:34px}}
kbd,.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--fg-2);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--fg-2);min-height:32px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap;line-height:20px}
.chip.plan{background:var(--plan-bg);color:var(--plan)} .chip.done{background:var(--done-bg);color:var(--done)}
.chip.late{background:var(--late-bg);color:var(--late)} .chip.pend{background:var(--pend-bg);color:var(--pend)}
.chip.none{background:var(--none-bg);color:var(--none)} .chip.priv{background:var(--priv-bg);color:var(--priv)}
.chip.star{color:var(--star);background:none;padding:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pdot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-height:34px;min-width:0;width:100%}
textarea.f{line-height:1.6;resize:vertical}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-2);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.empty{padding:28px 12px;text-align:center;color:var(--fg-3)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--pend-bg);color:var(--fg);border:1px solid color-mix(in srgb,var(--pend) 35%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.banner b{color:var(--pend)}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
table.t th{color:var(--fg-3);font-weight:500;font-size:12px;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.privacy .pv{filter:blur(6px);user-select:none;pointer-events:none}

/* 提醒 */
.rem{display:flex;flex-direction:column;gap:6px}
.rem-i{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--surface-2);cursor:pointer;border:0;text-align:left;width:100%;color:var(--fg)}
.rem-i:hover{outline:1px solid var(--line)}
.rem-i .tag{flex:none;font-size:11px;border-radius:4px;padding:0 5px;line-height:18px;margin-top:1px}
.tag.r{background:var(--late-bg);color:var(--late)} .tag.o{background:var(--pend-bg);color:var(--pend)} .tag.b{background:var(--plan-bg);color:var(--plan)} .tag.y{color:var(--star);background:none;padding:0}

/* 月曆 */
.calhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px;font-size:12px;color:var(--fg-3);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{position:relative;min-height:92px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 7px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0;color:var(--fg)}
.cell:hover{border-color:var(--fg-3)}
.cell.out{opacity:.4}
.cell.off{background:var(--surface-2)}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell .dn{font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px}
.cell .hn{font-size:10px;color:var(--late);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .hrs{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.cell .mk{display:flex;gap:3px;align-items:center;flex-wrap:wrap;font-size:11px}
.cell .lv{position:absolute;left:0;right:0;bottom:0;background:var(--priv-bg);border-top:1px solid color-mix(in srgb,var(--priv) 40%,transparent);pointer-events:none}
.cell .lvt{position:relative;font-size:10px;color:var(--priv)}
.cell > *{position:relative}
@media (max-width:1023px){.cell{min-height:64px;padding:4px}.cell .hn{display:none}.cell .hrs{font-size:10px}.calhead,.cal{gap:2px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px}
.wkcol{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px;min-height:220px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.wkcol.today{border-color:var(--accent)}
.wkt{font-size:12px;line-height:1.4;padding:4px 6px;border-radius:6px;background:var(--surface-2)}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.mm{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px}
.mm h4{margin:0 0 6px;font-size:13px;cursor:pointer}
.mmg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mmc{aspect-ratio:1;border-radius:3px;border:0;padding:0;cursor:pointer;font-size:9px;color:var(--fg-3);background:var(--surface-2);max-width:100%}
.mmc.e{background:none;cursor:default}

/* 每日頁 */
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dayhead h1{font-size:20px;white-space:nowrap}
.tool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.state{font-size:12px;color:var(--fg-3);display:inline-flex;align-items:center;gap:5px}
.state i{width:7px;height:7px;border-radius:50%;background:var(--none)}
.state.dirty i{background:var(--pend)} .state.saved i{background:var(--done)} .state.tpl i{background:var(--plan)}
.infobar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ed{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));background-size:100% var(--lh);background-position:0 14px;background-origin:padding-box}
.ed pre,.ed textarea{margin:0;padding:14px 16px;font-size:14px;line-height:var(--lh);font-family:var(--edf);white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;tab-size:4;letter-spacing:0;border:0;width:100%}
.ed pre{min-height:520px;color:var(--fg);pointer-events:none}
.ed textarea{position:absolute;inset:0;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--fg);outline:none;border-radius:12px}
.ed textarea::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:transparent}
.ed.read pre{pointer-events:auto;min-height:200px}
.ed.read textarea{display:none}
.hl-h{color:var(--accent);font-weight:inherit}
.ed.read .hl-h{font-weight:700}
.hl-c{color:var(--plan)} .hl-c.c2{color:var(--done)} .hl-c.c3{color:var(--pend)}
.hl-hr{background:var(--surface-2);border-radius:3px}
.hl-dl{color:var(--late)} .hl-star{color:var(--star)}
.hl-x{color:var(--fg-3)}
.hl-p{color:var(--priv)}
.hl-w{background:var(--pend-bg);border-radius:2px}
.hl-meta{color:var(--fg-3)}
.prev{margin-top:14px}
.pi{display:flex;gap:6px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line-2);font-size:13px;min-width:0}
.pi:last-child{border-bottom:0}
.pi .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.pi .hr{font-variant-numeric:tabular-nums;color:var(--fg-2);white-space:nowrap;font-size:12px}
.warn{background:var(--pend-bg);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.warn code{font-family:var(--mono);overflow-wrap:anywhere}
.pv-block.hidden-priv{padding:10px;color:var(--fg-3);font-size:12px}

/* 待辦／筆記 */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--fg-2);min-height:32px}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab .c{font-size:11px;opacity:.75;margin-left:4px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li.sel{background:var(--accent-soft)}
.li .main{flex:1;min-width:0}
.li .ttl{font-weight:500;overflow-wrap:anywhere}
.li .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--fg-3);align-items:center}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--fg-3);background:none;flex:none;display:grid;place-items:center;cursor:pointer;margin-top:1px;padding:0;color:var(--accent-fg)}
.ck.on{background:var(--done);border-color:var(--done)}
.ck svg{width:12px;height:12px}
.notes{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1023px){.notes{grid-template-columns:minmax(0,1fr)}.notes.editing .nlist{display:none}.notes:not(.editing) .neditor{display:none}}
.md h1,.md h2,.md h3{margin:.6em 0 .3em}
.md p{margin:.3em 0}
.md ul{margin:.3em 0;padding-left:1.3em}

/* 專案／甘特 */
.pcard{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.pcard:hover{border-color:var(--fg-3)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:10px}
.tl .tli{position:relative;font-size:13px}
.tl .tli::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--done);border:2px solid var(--surface)}
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh}
.g{position:relative;display:grid;grid-template-columns:200px auto}
@media (max-width:1023px){.g{grid-template-columns:120px auto}}
.gl{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);padding:0 8px;display:flex;align-items:center;gap:6px;height:34px;border-bottom:1px solid var(--line-2);font-size:12px;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gl.sub{padding-left:22px;color:var(--fg-2);height:26px}
.gl.sel{background:var(--accent-soft)}
.gl.head{position:sticky;top:0;z-index:4;height:40px;cursor:default;font-weight:600}
.gt{position:relative;height:34px;border-bottom:1px solid var(--line-2)}
.gt.sub{height:26px}
.gt.head{position:sticky;top:0;z-index:2;background:var(--surface);height:40px;font-size:11px;color:var(--fg-3)}

.gact{position:absolute;top:12px;height:10px;border-radius:2px}
.gdl{position:absolute;top:3px;font-size:12px;transform:translateX(-50%)}
.gtd{position:absolute;top:8px;width:9px;height:9px;border-radius:50%;transform:translateX(-50%)}
.gtoday{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--late);z-index:1;pointer-events:none}

/* 統計 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg)}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--fg-3)}
.hb{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12px;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:var(--fg)}
.hbr .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr .tr{height:16px;display:flex;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.hbr .tr i{display:block;height:100%}
.hbr .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.cols{display:flex;align-items:flex-end;gap:3px;height:170px;border-bottom:1px solid var(--line);padding-top:8px;position:relative}
.cols .c{flex:1;display:flex;flex-direction:column-reverse;min-width:3px;cursor:pointer;height:100%;justify-content:flex-start;border:0;background:none;padding:0}
.cols .c i{display:block;width:100%}

.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2);font-size:10px;color:var(--fg-3);pointer-events:none}
.gridline span{position:absolute;right:0;top:-14px}
.xl{display:flex;gap:3px;font-size:10px;color:var(--fg-3);margin-top:4px}
.xl span{flex:1;text-align:center;min-width:3px;overflow:hidden;white-space:nowrap}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg-2);margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:4px}

/* Modal／面板 */
.ov{position:fixed;inset:0;background:rgba(10,16,26,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(6vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}

const DEF_PROMPT=`請根據以下我的工作紀錄，撰寫「{期間}」的個人貢獻與成就總結。
要求：
1. 以「交付成果與影響」為主軸，不要寫成活動流水帳。
2. 依專案歸納：做了什麼、交付給誰、帶來什麼改變（有數字就用數字）。
3. 另列：投入最多的專案、時間分配特色、準時交付表現。

const DEF_SET={displayName:'馬哥',teamsName:'小馬',hoursPerDay:8,leaveUnit:1,
  leaveTypes:['特休','補休','病假','事假','公假','其他'],places:['板橋','台中','台北'],
  dailyItemLimit:5,workCategories:['專案','例行','會議','突發','授課','助教','導師','考官','跟課','聽課','異地辦公','其他'],exportDefaults:{priv:false,extras:false,loc:false,leave:false},
  holidaysText:HOLI_TEXT,theme:'auto',edFont:'mono',aiPrompt:DEF_PROMPT,lastBackup:null,importStartYear:2024};
const PCOLORS=['#0A97D9','#4C9F38','#FD6925','#DD1367','#26BDE2','#A21942','#FCC30B','#3F7E44','#E5243B','#BF8B2E','#FD9D24','#19486A','#DDA63A','#56C02B','#00689D','#FD6925','#E5243B'];
const CATS=['專案','例行','會議','突發','授課','助教','導師','考官','跟課','聽課','異地辦公','其他'];
function categories(){return [...new Set([...CATS,...(db?.settings?.workCategories||[])])]};
function catRE(){return new RegExp('^('+categories().map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\s*[-|]\\s*(.+)$')}
const STATUSES=['待辦','規劃','完成','已交付','延遲','放棄'];
const STCLS={'待辦':'none','規劃':'plan','完成':'done','已交付':'done','延遲':'late','放棄':'none'};
const REASONS=['被突發擠掉','等他人回覆','低估工時','臨時會議','其他'];
const OTTYPES=['無償','申報','補休'];

/* ---------- 資料存取（正式版改接 Firebase） ---------- */
let storageOk=true;
function emptyDb(settings){return{v:1,days:{},tasks:{},projects:{},notes:{},ot:[],settings:Object.assign(structuredClone(DEF_SET),settings||{}),sample:false}}
function loadDb(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);d.settings=Object.assign(structuredClone(DEF_SET),d.settings||{});d.ot=d.ot||[];return d}}catch(e){storageOk=false}return null}
let db=loadDb();
let drafts={};try{drafts=JSON.parse(localStorage.getItem(DKEY)||'{}')}catch(e){drafts={}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(DKEY,JSON.stringify(drafts));storageOk=true}catch(e){storageOk=false}}
const T=()=>Object.values(db.tasks);
const P=id=>db.projects[id];
const pname=id=>P(id)?.name||'（未指定）';
const pcolor=id=>P(id)?.color||'#888';

/* ---------- 假日／工作日 ---------- */
let HOL={h:{},w:{}},HOL_SRC=null;
function parseHoli(text){const h={},w={};for(const l of String(text||'').split('\n')){const m=l.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/);if(!m)continue;(/補班|補行上班/.test(m[2])?w:h)[m[1]]=m[2].trim()}return{h,w}}
function hol(){if(HOL_SRC!==db.settings.holidaysText){HOL=parseHoli(db.settings.holidaysText);HOL_SRC=db.settings.holidaysText}return HOL}
const hpd=()=>+db.settings.hoursPerDay||8;
function leaveHours(d){return sum(db.days[d]?.leaves||[],l=>l.hours)}
function isWorkday(d){const H=hol();if(H.w[d])return true;if(H.h[d])return false;const g=pd(d).getDay();return g!==0&&g!==6}
function isWorkingDay(d){return isWorkday(d)&&leaveHours(d)<hpd()}
function prevWorkday(d){let x=addD(d,-1);for(let i=0;i<40;i++){if(isWorkingDay(x))return x;x=addD(x,-1)}return addD(d,-1)}
function nextWorkday(d){let x=addD(d,1);for(let i=0;i<40;i++){if(isWorkingDay(x))return x;x=addD(x,1)}return addD(d,1)}
function workdaysBetween(a,b){let n=0,x=a;while(x<=b){if(isWorkingDay(x))n++;x=addD(x,1);if(n>2000)break}return n}

/* ---------- 文字解析 ---------- */
const NUM='(\\d+(?:\\.\\d+)?)',UNIT='(hrs?|h|小時|mins?|分鐘|分)';
function N(s){return String(s??'')
  .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248))
  .replace(/＿/g,'_').replace(/[｜|]/g,'|').replace(/：/g,':').replace(/，/g,',').replace(/（/g,'(').replace(/）/g,')')
  .replace(/－/g,'-').replace(/～/g,'~').replace(/．/g,'.').replace(/％/g,'%').replace(/／/g,'/').replace(/\u3000/g,' ').replace(/\t/g,' ').trim()}
const toH=(n,u)=>{n=+n;return /min|分/.test(u||'')?n/60:n};
const SEC_RE=[['today',/^(今日工作項目|今日計畫|今日計劃|今日工作|今日項目)\s*[:]?$/],['done',/^昨日完成\s*[:]?$/],['undone',/^昨日未完成\s*[:]?$/],['urgent',/^(昨日新增突發工作|昨日突發工作|突發工作|昨日新增突發)\s*[:]?$/]];
const SEC_NAME={today:'今日工作項目',done:'昨日完成',undone:'昨日未完成',urgent:'昨日新增突發工作'};
function secOf(t){for(const[k,re]of SEC_RE)if(re.test(t))return k;return null}
function preSplit(text){
  return String(text||'').split(/\r?\n/).map(line=>{
    const n=N(line);
    const heads=(n.match(/今日工作項目|今日計畫|今日計劃|昨日未完成|昨日完成|昨日新增突發工作/g)||[]).length;
    const cats=(n.match(new RegExp('(?:'+categories().join('|')+')\\s*[-|]','g'))||[]).length;
    if((heads&&n.length>8&&!secOf(n))||cats>=2){
      let x=line.replace(/\s*(今日工作項目|今日計畫|今日計劃|昨日未完成|昨日完成|昨日新增突發工作)\s*/g,'\n$1\n');
      x=x.replace(new RegExp('\\s+(?=(?:'+categories().join('|')+')\\s*[-－｜|])','g'),'\n');
      x=x.replace(/\n(無)\s+/g,'\n$1\n');
      return x;
    }
    return line;
  }).join('\n');
}
function parseDL(s){s=String(s).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return{y:+m[1],m:+m[2],d:+m[3]};
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})$/)))return{m:+m[1],d:+m[2]};
  if((m=s.match(/^(\d{1,2})(\d{2})$/)))return{m:+m[1],d:+m[2]};
  return null}
function resolveMD(o,ref,mode){ // mode 'future'：取 ref-7 天後最近一個；'near'：取最接近
  if(!o)return null;if(o.y)return `${o.y}-${pad(o.m)}-${pad(o.d)}`;
  if(o.m<1||o.m>12||o.d<1||o.d>31)return null;
  const y=+ref.slice(0,4);const cands=[y-1,y,y+1].map(Y=>`${Y}-${pad(o.m)}-${pad(o.d)}`);
  if(mode==='future'){for(const c of cands)if(diffD(ref,c)>=-7)return c;return cands[1]}
  return cands.sort(by(c=>Math.abs(diffD(ref,c))))[0]}
function splitTop(c){const out=[];let d=0,cur='';for(const ch of c){if(ch==='('||ch==='（')d++;if(ch===')'||ch==='）')d=Math.max(0,d-1);if(!d&&(ch==='、'||ch===',')){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim()).filter(Boolean)}
function splitContent(c){
  c=(c||'').trim();if(!c)return{title:'',subs:[]};
  const m=c.match(/^(.+?)(?<!\d):(?!\d)(.+)$/);
  if(m&&m[1].length<=30&&!/[(]/.test(m[1])){const subs=splitTop(m[2]);return{title:m[1].trim(),subs:subs.length>1?subs:[],tail:subs.length>1?'':m[2].trim()}}
  const subs=splitTop(c);
  return{title:c,subs:subs.length>1?subs:[]}}
function reasonTag(t){t=t||'';if(/突發|插件|臨時交辦|擠/.test(t))return'被突發擠掉';if(/等|回覆|待.*確認|卡/.test(t))return'等他人回覆';if(/低估|來不及|時間不足|不夠/.test(t))return'低估工時';if(/會議|開會/.test(t))return'臨時會議';return t?'其他':''}
function parseItem(raw,sec){
  const s=N(raw);
  const m=s.match(catRE());
  if(!m)return{ok:false,why:'找不到分類（行首須為 專案／例行／會議）'};
  const it={ok:true,sec,raw,cat:m[1],project:'',title:'',subs:[],est:null,actual:null,actualMissing:false,star:false,dl:null,
    doneCriteria:'',stopLoss:'',deliverTo:'',outcome:'',delivered:false,reason:'',newDate:null,pct:null,note:'',soft:''};
  let rest=m[2].trim();
  if(rest.includes('⭐')){it.star=true;rest=rest.replace(/⭐/g,' ').replace(/\s+/g,' ').trim()}
  const core=[];
  for(const g0 of rest.split('|')){const g=g0.trim();if(!g)continue;
    const e=g.match(/^(完成標準|停損點|DL|dl|交付|成果)\s*:\s*(.*)$/);
    if(e){const k=e[1].toUpperCase()==='DL'?'DL':e[1];if(k==='DL')it.dl=e[2].trim();if(k==='完成標準')it.doneCriteria=e[2].trim();if(k==='停損點')it.stopLoss=e[2].trim();if(k==='交付')it.deliverTo=e[2].trim();if(k==='成果')it.outcome=e[2].trim();continue}
    if(g==='已交付'){it.delivered=true;continue}
    core.push(g)}

let modalStack=[];
function openModal({title,body,foot,wide,onMount,onClose,cls}){
  const root=$('#modal-root');const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md-box ${wide?'wide':''} ${cls||''}" role="dialog" aria-modal="true" aria-label="${esc(title||'')}">${title!=null?`<div class="md-h"><button class="xbtn" data-act="mclose" aria-label="關閉（Esc）">×</button><h2>${esc(title)}</h2></div>`:''}<div class="md-b">${body||''}</div>${foot?`<div class="md-f">${foot}</div>`:''}</div>`;
  const prevFocus=document.activeElement;root.appendChild(ov);
  const m={ov,onClose,prevFocus};modalStack.push(m);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  ov.addEventListener('keydown',e=>{if(e.key==='Tab'){const f=$$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])',ov).filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){b.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===b){a.focus();e.preventDefault()}}});
  onMount&&onMount(ov);
  const af=$('[autofocus]',ov)||$('input,textarea,select,button',ov);af&&setTimeout(()=>af.focus(),0);
  return ov}
function closeModal(){const m=modalStack.pop();if(!m)return;m.ov.remove();m.onClose&&m.onClose();m.prevFocus&&m.prevFocus.focus&&document.contains(m.prevFocus)&&m.prevFocus.focus()}

  if(plan.some(t=>t.status==='延遲'))st='late';else if(plan.length&&plan.every(t=>['完成','已交付'].includes(t.status)))st='done';else if(plan.length)st='plan';
  else if(!dd?.rawText&&isWorkingDay(d)&&d<today())st='none';
  const urg=ts.some(t=>t.isUrgent);const lv=leaveHours(d);const trip=(dd?.locations||[]).some(l=>l.trip);
  const dls=T().filter(t=>t.dl===d&&!t.archived).length+Object.values(db.projects).filter(p=>p.dl===d).length;
  const ot=sum(db.ot.filter(o=>o.date===d),o=>o.hours);
  return{dd,ts,plan,hrs,est,st,urg,lv,trip,dls,ot,warn:(dd?.warnings||[]).filter(w=>w.level==='err').length}}

function guideSource(){return $('#ta')?.value??dayText(S.day)}
function guideReplaceSection(text,key,lines){
 const ls=text.split('\n'),start=ls.findIndex(l=>secOf(N(l))===key);
 if(start<0)return text+'\n\n'+SEC_NAME[key]+'\n'+(lines.length?lines.join('\n'):'無');
 let end=start+1;while(end<ls.length){const n=N(ls[end]);if(secOf(n)||/^[—─\-=_]{3,}$/.test(n)||/^私記/.test(n))break;end++}
 ls.splice(start+1,end-start-1,...(lines.length?lines:['無']), '');return ls.join('\n')
}

 let text=guideSource();text=guideReplaceSection(text,section,lines);
 const ta=$('#ta');if(ta){ta.value=text;ta.dispatchEvent(new Event('input'))}else{S.edit=true;drafts[S.day]=text;render();const t=$('#ta');if(t){t.dispatchEvent(new Event('input'))}}

 const places=guidePlaces.filter(x=>String(x.place||'').trim()).map(x=>`${x.start&&x.end?x.start+'-'+x.end+' ':''}${x.place}${x.activity?'（'+(x.trip?'出差':'一般辦公')+'：'+x.activity+'）':(x.trip?'（出差）':'')}`).join(' | ');
 const leaves=guideLeaves.filter(x=>String(x.type||'').trim()&&Number(x.hours)>0).map(x=>`${x.type} ${fh(x.hours)}hr`).join(' | ');
 return {places,leaves};

function guideMergeHeader(text){

 let lines=text.split('\n');
 for(const [name,value] of [['辦公地',h.places],['請假',h.leaves]]){
  const i=lines.findIndex(l=>new RegExp('^'+name+'\\s*[:：]').test(l.trim()));

  else {const dateIndex=lines.findIndex(l=>/^日期\s*[:：]/.test(l.trim()));lines.splice(Math.max(0,dateIndex+1),0,name+'：'+value)}
 }

 if(type==='add-place'){

 if(type==='output-all'||type==='copy-all'){
  const t=guideCompleteText();

 }

 if(type==='remove'){guideItems.splice(+el.dataset.i,1);guideRender();return}
 if(type==='from-text'){guideItems=parseDay(guideSource()).today.filter(i=>i.est!=null).map(i=>({category:i.cat,project:i.project,hours:i.est,detail:i.doneText||((i.title!==i.project)?i.title:'')}));guideRender();return}
 if(type==='output-today'||type==='copy-today'){const lines=guideItems.map(x=>`${x.category}-${x.project}_${hrTok(x.hours)}${x.detail?'，'+x.detail:''}`);if(!lines.length){toast('請先加入工作項目');return}if(type==='copy-today')copy('今日工作項目\n'+lines.join('\n'));else guideCommit('today',lines);return}
 if(type==='output-prev'||type==='copy-prev'){const {done,undone}=guideOutputPrev();if(!done.length&&!undone.length){toast('請先選擇完成或未完成的項目');return}if(type==='copy-prev'){copy('昨日完成\n'+(done.join('\n')||'無')+'\n\n昨日未完成\n'+(undone.join('\n')||'無'));return}let text=guideSource();text=guideReplaceSection(text,'done',done);text=guideReplaceSection(text,'undone',undone);const ta=$('#ta');if(ta){ta.value=text;ta.dispatchEvent(new Event('input'))}else{S.edit=true;drafts[S.day]=text;render();$('#ta')?.dispatchEvent(new Event('input'))}toast('昨日盤點已產生，將自動儲存')}
}

let daySaveT=null;

function saveDraftNow(){if(S.page==='day'&&$('#ta'))autoSaveDay();S.dirty=false}
function hlHTML(text,r,read){
  const ls=text.split('\n');const bad=new Set(r.warnings.filter(w=>w.level==='err').map(w=>w.i));
  // 解析時可能前置拆行；只有行數一致才逐行上色
  const aligned=r.lines.length===ls.length;
  let inPriv=false;
  return ls.map((line,i)=>{const t=N(line);
    if(!inPriv&&(/^[—─\-=_]{3,}$/.test(t)||/^私記/.test(t)))inPriv=true;
    if(inPriv){if(read&&S.privacy)return i===ls.findIndex(l=>/^[—─\-=_]{3,}$/.test(N(l))||/^私記/.test(N(l)))?'<span class="hl-p">（隱私模式：私記已隱藏）</span>':'';return `<span class="hl-p">${esc(line)}</span>`}
    if(secOf(t))return `<span class="hl-h">${esc(line)}</span>`;
    if(/^(日期|姓名|辦公地|請假)\s*:/.test(t))return `<span class="hl-meta">${esc(line)}</span>`;
    const w=aligned&&bad.has(i);
    let h=esc(line);
    h=h.replace(new RegExp('^('+categories().join('|')+')(\\s*[-－｜|])'),(m0,c,sep)=>`<span class="hl-c ${c==='例行'?'c2':c==='會議'?'c3':''}">${c}</span>${sep}`);
    h=h.replace(/(預\s*)?(\d+(?:\.\d+)?\s*(?:hr|h|min|分鐘|小時)|＿hr)/g,m0=>`<span class="hl-hr">${m0}</span>`);
    h=h.replace(/([｜|]\s*)(DL\s*[:：]\s*[\d\/\-]+)/g,'$1<span class="hl-dl">$2</span>');
    h=h.replace(/⭐/g,'<span class="hl-star">⭐</span>');
    h=h.replace(/([｜|]\s*)((?:完成標準|停損點|交付|成果)\s*[:：][^｜|]*|已交付)/g,'$1<span class="hl-x">$2</span>');
    return w?`<span class="hl-w">${h}</span>`:h}).join('\n')}
function infoHTML(r){
  const D=S.day;const lv=sum(r.header.leaves||[],l=>l.hours);const avail=Math.max(0,hpd()-lv);const est=sum(r.today,i=>i.est||0);
  const stars=r.today.filter(i=>i.star).length;const lim=+db.settings.dailyItemLimit||0;
  const err=r.warnings.filter(w=>w.level==='err').length;
  return [`<span class="chip ${est>avail?'late':'plan'} num">今日預估 ${fh(est)} / 可用 ${fh(avail)} hr</span>`,
    lv?`<span class="chip priv pv">請假 ${(r.header.leaves||[]).map(l=>esc(l.type)+' '+fh(l.hours)+'hr').join('、')}</span>`:'',
    (r.header.locations||[]).length?`<span class="chip pv">辦公地 ${(r.header.locations||[]).map(l=>esc(l.place)+(l.trip?'🚄':'')).join('→')}</span>`:'',
    `<span class="chip ${r.today.length>lim&&lim?'pend':''}">項目 ${r.today.length}${lim?` / 上限 ${lim}`:''}</span>`,
    stars===1?'<span class="chip star">⭐ 主星已指定</span>':stars>1?`<span class="chip pend">⭐ ${stars} 顆主星</span>`:r.today.length?'<span class="chip">未指定 ⭐</span>':'',
    err?`<span class="chip pend">待確認 ${err} 行</span>`:'',
    est>avail?'<span class="chip late">預估超過可用工時</span>':''].join('')}
function itemRow(it,mode){

  return`<div class="pi"><span class="chip ${it.cat==='專案'?'plan':it.cat==='例行'?'done':'pend'}">${it.cat}</span>${it.star?'<span class="chip star">⭐</span>':''}
    <span class="tt"><b>${esc(it.project)}</b>${it.title&&it.title!==it.project?`｜${esc(it.title)}`:''}${it.subs.length?` <span class="sub">（${it.subs.length} 子項）</span>`:''}
    ${it.dl?` <span class="chip late">DL ${esc(it.dl)}</span>`:''}${it.delivered?' <span class="chip done">已交付</span>':''}${it.reason?`<br><span class="sub">因 ${esc(it.reason)}${it.newDate?`，擬 ${it.newDate.m}/${it.newDate.d}`:''}</span>`:''}${it.doneText&&mode!=='today'?`<br><span class="sub">${esc(it.doneText)}</span>`:''}</span>
    <span class="hr">${hr}</span></div>`}

      ${infos.map(w=>`<div class="warn" style="background:var(--surface-2)"><span class="chip">第 ${w.i+1} 行</span><span style="flex:1;min-width:0">${esc(w.why)}：<code>${esc(w.raw)}</code></span></div>`).join('')}</div></div>`:''}
    ${sec('today','today')}${sec('done','done')}${sec('undone','undone')}${sec('urgent','urgent')}
    <div class="card"><div class="row" style="margin-bottom:6px"><h3>今日任務狀態（已存檔）</h3><span class="sub">改狀態會影響明天的模板帶入</span></div>
      ${saved.length?saved.map(t=>`<div class="pi"><span class="pdot" style="background:${pcolor(t.projectId)};margin-top:5px"></span><span class="tt">${t.isStar?'⭐ ':''}<b>${esc(pname(t.projectId))}</b>｜${esc(t.title)}${t.carriedCount?` <span class="chip late">延續第 ${t.carriedCount} 次</span>`:''}${t.source==='todo'?' <span class="chip">待辦</span>':''}</span>
        <select data-act="setstatus" data-id="${t.id}" aria-label="狀態" style="width:auto;min-height:28px;padding:2px 6px">${STATUSES.filter(s=>s!=='待辦').map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>

    <div class="card pv"><div class="row" style="margin-bottom:6px"><h3>私記・加班</h3><span class="sub">→ ${md(Pd)}，不進任何匯出（除非勾選）</span></div>
      ${r.ot.length?r.ot.map(o=>`<div class="pi"><span class="chip priv">${o.type}</span><span class="tt">${esc(o.text)}</span><span class="hr">${fh(o.hours)}hr</span></div>`).join(''):'<div class="sub">無加班紀錄</div>'}

function saveDay(andBack){
  clearTimeout(daySaveT);const D=S.day;const ta=$('#ta');const text=ta?ta.value:dayText(D);

  const D=today();const all=T().filter(t=>t.source==='todo'||t.source==='carry');
  const open=t=>!t.archived&&!['已交付','放棄'].includes(t.status);
  const overdue=all.filter(t=>open(t)&&!['完成'].includes(t.status)&&((t.dl&&t.dl<D)||(t.date&&t.date<D&&t.status==='規劃')));
  const od=new Set(overdue.map(t=>t.id));
  let arch=all.filter(t=>t.archived);
  if(S.archYear!=='all')arch=arch.filter(t=>(t.deliveredAt||t.date||'').startsWith(S.archYear));
  if(S.archProj!=='all')arch=arch.filter(t=>t.projectId===S.archProj);
  return{'未排日':all.filter(t=>open(t)&&!t.date&&!od.has(t.id)).sort(by(t=>t.dl||'9999')),
    '已排日':all.filter(t=>open(t)&&t.date&&!od.has(t.id)).sort(by(t=>t.date)),
    '逾期':overdue.sort(by(t=>t.dl||t.date)),
    '封存':arch.sort(by(t=>t.deliveredAt||t.date||'',-1))}}

function mdHTML(s){return esc(s).split('\n').map(l=>{
  if(/^### /.test(l))return`<h3>${l.slice(4)}</h3>`;if(/^## /.test(l))return`<h2>${l.slice(3)}</h2>`;if(/^# /.test(l))return`<h1 style="font-size:18px">${l.slice(2)}</h1>`;
  l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(/^- \[( |x)\] /i.test(l))return`<div>${/^- \[x\]/i.test(l)?'☑':'☐'} ${l.slice(6)}</div>`;
  if(/^- /.test(l))return`<div style="padding-left:1em;text-indent:-.8em">• ${l.slice(2)}</div>`;
  return l?`<p>${l}</p>`:''}).join('')}

function projMerge(pid){const p=P(pid);const others=Object.values(db.projects).filter(x=>x.id!==pid);

function mergeProject(a,b){const A=P(a),B=P(b);T().forEach(t=>{if(t.projectId===a)t.projectId=b});db.ot.forEach(o=>{if(o.projectId===a)o.projectId=b});
  Object.values(db.notes).forEach(n=>{n.projectIds=[...new Set((n.projectIds||[]).map(x=>x===a?b:x))]});
  B.aliases=[...new Set([...(B.aliases||[]),A.name,...(A.aliases||[])])].filter(x=>x!==B.name);
  if(!B.planStart||(A.planStart&&A.planStart<B.planStart))B.planStart=A.planStart||B.planStart;if(!B.planEnd||(A.planEnd&&A.planEnd>B.planEnd))B.planEnd=A.planEnd||B.planEnd;
  delete db.projects[a];persist()}
function ganttData(){
  const ps=Object.values(db.projects).filter(p=>S.gAll||p.status==='進行中');
  const rows=ps.map(p=>{const d=projDetail(p.id);return{p,d}}).filter(x=>x.d.first||x.p.planStart||x.p.dl).sort(by(x=>x.d.first||x.p.planStart||'9999'));
  let a=addD(today(),-21),b=addD(today(),35);
  rows.forEach(({p,d})=>{[d.first,p.planStart].forEach(x=>{if(x&&x<a)a=x});[d.last,p.planEnd,p.dl].forEach(x=>{if(x&&x>b)b=x})});
  a=addD(a,-3);b=addD(b,5);return{rows,a,b}}
function ganttHTML(){
  const{rows,a,b}=ganttData();const px={week:30,month:10,quarter:3.5}[S.gZoom];const n=diffD(a,b)+1;const W=Math.round(n*px);const X=d=>Math.round(diffD(a,d)*px);
  if(S.gSel>=rows.length)S.gSel=Math.max(0,rows.length-1);
  let marks='';let x=a;
  if(S.gZoom==='week'){while(x<=b){if(pd(x).getDay()===1||x===a)marks+=`<div class="gm" style="left:${X(x)}px">${md(x)}</div>`;x=addD(x,1)}}
  else{x=`${a.slice(0,7)}-01`;while(x<=b){if(x>=a)marks+=`<div class="gm" style="left:${X(x)}px">${S.gZoom==='quarter'&&+x.slice(5,7)%3!==1?'':`${x.slice(0,4)}/${+x.slice(5,7)}`}</div>`;x=iso(new Date(+x.slice(0,4),+x.slice(5,7),1))}}
  const td=`<div class="gtoday" style="left:${X(today())}px"></div>`;
  let L=`<div class="gl head">專案</div><div class="gt head" style="width:${W}px">${marks}${td}</div>`;
  rows.forEach(({p,d},i)=>{
    L+=`<div class="gl ${i===S.gSel?'sel':''}" data-act="gsel" data-i="${i}" title="${esc(p.name)}"><span>${S.gOpen[p.id]?'▾':'▸'}</span><span class="pdot" style="background:${p.color}"></span>${esc(p.name)}</div>`;
    let tr='';if(p.planStart&&p.planEnd)tr+=`<div class="gplan" style="left:${X(p.planStart)}px;width:${Math.max(px,X(p.planEnd)-X(p.planStart)+px)}px;background:${p.color}" title="計畫 ${p.planStart}～${p.planEnd}"></div>`;
    d.ds.forEach(dd=>{tr+=`<div class="gact" style="left:${X(dd)}px;width:${Math.max(2,px-1)}px;background:${p.color}" title="${dd}"></div>`});
    if(p.dl)tr+=`<div class="gdl" style="left:${X(p.dl)+px/2}px" title="DL ${p.dl}">🚩</div>`;
    L+=`<div class="gt" style="width:${W}px">${tr}${td}</div>`;
    if(S.gOpen[p.id]){d.ts.filter(t=>t.date||t.dl).sort(by(t=>t.date||t.dl)).slice(0,40).forEach(t=>{
      L+=`<div class="gl sub" data-act="task" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</div><div class="gt sub" style="width:${W}px">${t.date?`<div class="gtd" style="left:${X(t.date)+px/2}px;background:var(--${STCLS[t.status]})" title="${t.date} ${t.status}"></div>`:''}${t.dl?`<div class="gdl" style="left:${X(t.dl)+px/2}px;top:1px;font-size:10px">🚩</div>`:''}${td}</div>`})}});
  return`<div class="row" style="margin-bottom:10px"><div class="seg">${[['week','週'],['month','月'],['quarter','季']].map(([k,l])=>`<button data-act="gzoom" data-v="${k}" aria-pressed="${S.gZoom===k}">${l}</button>`).join('')}</div>
    <label class="row sub"><input type="checkbox" data-act="gall" ${S.gAll?'checked':''}> 顯示暫停與結案</label><span class="sp" style="flex:1"></span><span class="sub">↑↓ 選專案・Enter 展開・＋／－ 縮放</span></div>
  ${rows.length?`<div class="gwrap" id="gwrap" tabindex="0"><div class="g">${L}</div></div>
  <div class="legend"><span><i class="pdot" style="background:var(--plan);opacity:.3"></i>計畫區間</span><span><i class="pdot" style="background:var(--plan)"></i>有紀錄的日子</span><span>🚩 DL</span><span><i style="display:inline-block;width:2px;height:12px;background:var(--late)"></i>今天</span></div>`:'<div class="empty">沒有可顯示的專案</div>'}`}
after.projects=()=>{const g=$('#gwrap');if(g){const{a}=ganttData();const px={week:30,month:10,quarter:3.5}[S.gZoom];g.scrollLeft=Math.max(0,diffD(a,today())*px-g.clientWidth/2)}};

function pgStats(){
  const k=S.statKind,a=S.statAnchor;const[from,to]=periodRange(k,a);const s=calcStats(from,to);const tot=s.office+s.unpaid+s.decl;
  const head=`<div class="ph"><h1>統計</h1><span class="sp"></span><button class="btn sm" data-act="weekly">週報</button><button class="btn sm" data-act="aipack">AI 資料包</button></div>
  <div class="row" style="margin-bottom:14px"><div class="seg">${[['day','日'],['week','週'],['month','月'],['half','半年'],['year','年'],['custom','自訂']].map(([x,l])=>`<button data-act="statkind" data-v="${x}" aria-pressed="${k===x}">${l}</button>`).join('')}</div>
    ${k!=='custom'?`<button class="btn sm" data-act="statmove" data-n="-1" aria-label="上一期">‹</button><b>${periodLabel(k,a)}</b><button class="btn sm" data-act="statmove" data-n="1" aria-label="下一期">›</button>`:
    `<input type="date" id="st-f" value="${from}" style="width:auto"> ～ <input type="date" id="st-t" value="${to}" style="width:auto">`}</div>`;
  const dq=t=>({from,to,...t});
  const kpis=`<div class="kpis">
    <button class="kpi" data-act="drill" data-q='${esc(JSON.stringify(dq({type:'all'})))}'><b>${fh(s.office)}</b><span>辦公室工時 hr</span></button>
    <div class="kpi"><b>${s.days}<small style="font-size:12px"> / ${s.wdays}</small></b><span>出勤天數 / 工作日</span></div>
    <div class="kpi"><b>${s.days?fh(s.office/s.days):'—'}</b><span>平均每日工時</span></div>
    <button class="kpi pv" data-act="drill" data-q='${esc(JSON.stringify(dq({type:'ot'})))}'><b>${fh(s.unpaid)}</b><span>無償加班 hr（佔 ${tot?Math.round(s.unpaid/tot*100):0}%）</span></button>
    <button class="kpi" data-act="drill" data-q='${esc(JSON.stringify(dq({type:'ontime'})))}'><b>${s.ontime.n?Math.round(s.ontime.ok/s.ontime.n*100)+'%':'—'}</b><span>準時率（${s.ontime.ok}/${s.ontime.n}）</span></button>
    <button class="kpi" data-act="drill" data-q='${esc(JSON.stringify(dq({type:'delay'})))}'><b>${s.delays.n}</b><span>延遲次數</span></button></div>`;
  // 時間序列
  let buckets=[];
  if(['day','week','month','custom'].includes(k)&&diffD(from,to)<=62){let x=from;while(x<=to){buckets.push({l:k==='month'||diffD(from,to)>14?String(+x.slice(8)):`${md(x)}${wd(x)}`,f:x,t:x});x=addD(x,1)}}
  else{let x=`${from.slice(0,7)}-01`;while(x<=to){const e=iso(new Date(+x.slice(0,4),+x.slice(5,7),0));buckets.push({l:`${+x.slice(5,7)}月`,f:x<from?from:x,t:e>to?to:e});x=iso(new Date(+x.slice(0,4),+x.slice(5,7),1))}}
  buckets.forEach(b=>{b.o=sum(s.ts.filter(t=>t.date>=b.f&&t.date<=b.t),t=>t.actual?.office);b.d=sum(s.ots.filter(o=>o.date>=b.f&&o.date<=b.t&&o.type!=='無償'),o=>o.hours);b.u=sum(s.ots.filter(o=>o.date>=b.f&&o.date<=b.t&&o.type==='無償'),o=>o.hours)});
  const bmax=Math.max(1,...buckets.map(b=>b.o+b.d+b.u));const nice=bmax<=10?(bmax<=8?8:10):Math.ceil(bmax/20)*20;
  const series=`<div class="cols">${[.5,1].map(f=>`<div class="gridline" style="bottom:${f*100}%"><span>${fh(nice*f)}h</span></div>`).join('')}${buckets.map(b=>`<button class="c" data-act="drill" data-q='${esc(JSON.stringify({type:'all',from:b.f,to:b.t}))}' title="${b.f}${b.f!==b.t?'～'+b.t:''}：辦公室 ${fh(b.o)}、申報 ${fh(b.d)}、無償 ${fh(b.u)}"><i style="height:${b.o/nice*100}%;background:var(--accent)"></i><i class="pv" style="height:${b.d/nice*100}%;background:var(--pend)"></i><i class="pv" style="height:${b.u/nice*100}%;background:var(--priv)"></i></button>`).join('')}</div>
    <div class="xl">${buckets.map((b,i)=>`<span>${buckets.length>20&&i%3?'':b.l}</span>`).join('')}</div><div class="lg"><span><i style="background:var(--accent)"></i>辦公室</span><span class="pv"><i style="background:var(--pend)"></i>申報加班</span><span class="pv"><i style="background:var(--priv)"></i>無償加班</span></div>`;
  const seriesT=tbl(['期間','辦公室','申報','無償'],buckets.map(b=>[b.f===b.t?b.f:`${b.f}～${b.t}`,fh(b.o),fh(b.d),fh(b.u)]));
  // 專案排行
  const pr=Object.entries(s.byProj).map(([pid,v])=>({pid,...v,t:v.office+v.unpaid+v.decl})).sort(by(x=>x.t,-1));const pmax=Math.max(1,...pr.map(x=>x.t));
  const projChart=hbars(pr.slice(0,12).map(x=>({label:x.pid==='_none'?'未對應專案':pname(x.pid),dot:x.pid==='_none'?'var(--none)':pcolor(x.pid),total:x.t,drill:dq({type:'project',id:x.pid}),
    segs:[{v:x.office,c:x.pid==='_none'?'var(--none)':pcolor(x.pid),n:'辦公室'},{v:x.decl,c:'var(--pend)',n:'申報',pv:1},{v:x.unpaid,c:'var(--priv)',n:'無償',pv:1}]})),pmax);
  const projT=tbl(['專案','辦公室','申報','無償','合計','人日'],pr.map(x=>[esc(x.pid==='_none'?'未對應專案':pname(x.pid)),fh(x.office),fh(x.decl),fh(x.unpaid),fh(x.t),fh(x.t/hpd())]));
  // 分類
  const cmax=Math.max(1,...categories().map(c=>s.byCat[c]||0));const ccol={專案:'var(--plan)',例行:'var(--done)',會議:'var(--pend)',其他:'var(--priv)'};
  const catChart=hbars(categories().map(c=>({label:c,total:s.byCat[c]||0,vtxt:`${fh(s.byCat[c]||0)}h ${s.office?Math.round((s.byCat[c]||0)/s.office*100):0}%`,drill:dq({type:'cat',id:c}),segs:[{v:s.byCat[c]||0,c:ccol[c],n:c}]})),cmax);
  const catT=tbl(['分類','工時','佔比'],categories().map(c=>[c,fh(s.byCat[c]||0),s.office?Math.round((s.byCat[c]||0)/s.office*100)+'%':'—']));
  // 估時
  const accChart=`<div class="hb">${categories().map(c=>{const x=s.acc[c];const r=x.e?x.a/x.e:null;return`<div class="hbr" style="cursor:default"><span class="lb">${c}</span><span class="tr" style="position:relative">${r?`<i style="width:${Math.min(100,r/2*100)}%;background:${r>1.25?'var(--late)':r<.8?'var(--plan)':'var(--done)'}"></i>`:''}<span style="position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--fg-3)"></span></span><span class="v">${r?'×'+r.toFixed(2):'—'}</span></div>`}).join('')}</div><p class="sub" style="margin:8px 0 0">實際 ÷ 預估；虛線＝1.0（剛好），超過代表低估。</p>`;
  const accT=tbl(['分類','預估','實際','倍率','筆數'],categories().map(c=>{const x=s.acc[c];return[c,fh(x.e),fh(x.a),x.e?'×'+(x.a/x.e).toFixed(2):'—',x.n]}));
  // 延遲
  const tg=Object.entries(s.delays.tags).sort(by(x=>x[1],-1));const tmax=Math.max(1,...tg.map(x=>x[1]));
  const delChart=hbars(tg.map(([k2,v])=>({label:k2,total:v,vtxt:v+' 次',drill:dq({type:'delay',tag:k2}),segs:[{v,c:'var(--late)',n:k2}]})),tmax);
  const delT=tbl(['原因','次數'],tg.map(([k2,v])=>[esc(k2),v]));
  // 請假／辦公地
  const lvT=tbl(['假別','時數','天數'],Object.entries(s.leaves).map(([k2,v])=>[esc(k2),fh(v),fh(v/hpd())]));
  const locT=tbl(['地點','天數'],Object.entries(s.locs).sort(by(x=>x[1],-1)).map(([k2,v])=>[esc(k2),v]));
  return head+kpis+`<div class="grid g2">
    ${chartCard('series','工時走勢',series,seriesT)}
    ${chartCard('proj','專案工時排行（哪件事做最多）',projChart,projT)}
    ${chartCard('cat','分類佔比',catChart,catT)}
    ${chartCard('acc','估時準確度',accChart,accT)}
    ${chartCard('delay','延遲原因',delChart,delT,`<span class="sub">共 ${s.delays.n} 次</span>`)}
    <div class="card pv"><h3 style="margin-bottom:8px">加班與補休</h3><dl class="kv"><dt>無償加班</dt><dd>${fh(s.unpaid)}hr</dd><dt>申報加班</dt><dd>${fh(s.decl)}hr</dd><dt>轉補休（本期）</dt><dd>${fh(s.comp)}hr</dd>
      <dt>${to.slice(0,4)} 補休累積</dt><dd>${fh(s.compEarned)}hr</dd><dt>${to.slice(0,4)} 補休已用</dt><dd>${fh(s.compUsed)}hr</dd><dt>補休餘額</dt><dd><b>${fh(s.compEarned-s.compUsed)}hr</b></dd></dl></div>
    <div class="card pv"><h3 style="margin-bottom:8px">請假</h3><div class="tbl-wrap">${lvT}</div></div>
    <div class="card pv"><h3 style="margin-bottom:8px">辦公地</h3><div class="tbl-wrap">${locT}</div><p class="sub" style="margin:8px 0 0">出差 ${s.trips} 天</p></div>

function drill(q){const from=q.from,to=q.to;let ts=T().filter(t=>t.date&&t.date>=from&&t.date<=to&&t.status!=='待辦');let title='明細';let ots=[];
  if(q.type==='project'){ts=ts.filter(t=>q.id==='_none'?false:t.projectId===q.id);ots=db.ot.filter(o=>o.date>=from&&o.date<=to&&(o.projectId||'_none')===q.id);title=`${q.id==='_none'?'未對應專案':pname(q.id)}｜明細`}
  if(q.type==='cat'){ts=ts.filter(t=>t.category===q.id);title=`${q.id}｜明細`}
  if(q.type==='delay'){ts=ts.filter(t=>t.status==='延遲'&&(!q.tag||(t.delayReasonTag||'未填')===q.tag));title='延遲明細'}
  if(q.type==='ontime'){ts=T().filter(t=>t.status==='已交付'&&t.dl&&(t.deliveredAt||t.date)>=from&&(t.deliveredAt||t.date)<=to);title='有 DL 的交付'}
  if(q.type==='ot'){ts=[];ots=db.ot.filter(o=>o.date>=from&&o.date<=to);title='加班明細'}
  if(q.type==='all'){ots=db.ot.filter(o=>o.date>=from&&o.date<=to)}
  ts.sort(by(t=>t.date));
  const body=`<div class="sub">${from} ～ ${to}・任務 ${ts.length} 筆・辦公室 ${fh(sum(ts,t=>t.actual?.office))}hr${ots.length?`・加班 ${fh(sum(ots,o=>o.hours))}hr`:''}</div>
  ${ts.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>日期</th><th>專案</th><th>任務</th><th class="n">預估</th><th class="n">實際</th><th>狀態</th>${q.type==='ontime'?'<th>DL</th><th>交付日</th>':''}${q.type==='delay'?'<th>原因</th>':''}</tr></thead><tbody>
  ${ts.map(t=>`<tr data-act="task" data-id="${t.id}" style="cursor:pointer"><td class="num">${t.date}</td><td>${esc(pname(t.projectId))}</td><td>${esc(t.title)}</td><td class="n">${fh(t.estHours)}</td><td class="n">${fh(t.actual?.office)}</td><td><span class="chip ${STCLS[t.status]}">${t.isUrgent?'突發':t.status}</span></td>${q.type==='ontime'?`<td class="num">${t.dl}</td><td class="num">${t.deliveredAt||t.date}${(t.deliveredAt||t.date)<=t.dl?'':' <span class="chip late">逾期</span>'}</td>`:''}${q.type==='delay'?`<td>${esc(t.delayReasonTag||'未填')}${t.delayReasonText?'：'+esc(t.delayReasonText):''}</td>`:''}</tr>`).join('')}</tbody></table></div>`:''}
  ${ots.length?`<h3>加班</h3><div class="tbl-wrap pv"><table class="t"><thead><tr><th>日期</th><th>類型</th><th>內容</th><th>專案</th><th class="n">hr</th></tr></thead><tbody>${ots.map(o=>`<tr><td class="num">${o.date}</td><td>${o.type}</td><td>${esc(o.text)}</td><td>${esc(o.projectId?pname(o.projectId):'—')}</td><td class="n">${fh(o.hours)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  openModal({title,body,wide:true,foot:'<button class="btn" data-act="mclose">關閉</button>'})}

function splitImport(text,startYear){
  const lines=String(text||'').split(/\r?\n/);const chunks=[];let cur=null;
  const dre=/^\s*(?:小馬)?\s*(?:(\d{4})\s*[-\/.年]\s*)?(\d{1,2})\s*[\/月.]\s*(\d{1,2})\s*日?(?=$|\s|[（(]|[^\d\/])/;
  for(const l of lines){const m=N(l).match(dre);const rest=m?N(l).slice(m[0].length).trim():'';
    const looksDate=m&&+m[2]>=1&&+m[2]<=12&&+m[3]>=1&&+m[3]<=31&&(!rest||/今日|昨日|定案|工作|^[（(]/.test(rest));
    if(looksDate){cur={y:m[1]?+m[1]:null,m:+m[2],d:+m[3],head:l,lines:[]};chunks.push(cur);if(rest&&/今日|昨日/.test(rest))cur.lines.push(N(l).slice(m[0].length));}
    else if(cur)cur.lines.push(l)}
  let y=+startYear,pm=null;
  for(const c of chunks){
    c.warn=[];
    if(c.y){y=c.y}else{if(pm!=null&&c.m<pm){if(pm-c.m>=6)y++;else c.warn.push('月份比前一筆早（順序倒退），沿用同年')}c.y=y}
    pm=c.m;
    const body=c.lines.join('\n');const clue=[...body.matchAll(/(?<!\d)(11[2-9])(?:年|Q[1-4]|(0[1-9]|1[0-2])(?!\d))/g)].map(x=>+x[1]+1911);
    if(clue.length&&!clue.includes(c.y)){c.warn.push(`內容線索指向 ${[...new Set(clue)].join('/')} 年`);c.conflict=true}
    c.date=`${c.y}-${pad(c.m)}-${pad(c.d)}`;
    if(isNaN(pd(c.date))||pd(c.date).getMonth()+1!==c.m){c.warn.push('日期無效');c.bad=true}
    c.text=`日期：${c.date}（${wd(c.date)}）\n姓名：${db.settings.displayName}\n${body.trim()}`;
    const r=parseDay(c.text);c.items=r.today.length+r.done.length+r.undone.length+r.urgent.length;c.errs=r.warnings.filter(w=>w.level==='err').length;
    c.exist=!!db.days[c.date]?.rawText;c.action=c.exist?'skip':'write'}
  return chunks}

      else if(s==='undone')line=`${c}-${p}｜${t||p}_${hrTok(+e||0)}，因${r||'＿＿'}，擬${mmdd(S.day)}完成`;
      else line=`${c}-${p}${e!==''?'_'+hrTok(+e):''}${t?'，'+t:''}`;
      ls[i]=line;ta.value=ls.join('\n');closeModal();ta.dispatchEvent(new Event('input'));toast('已補正，記得存檔')}}})}

  newnote:()=>newNote(),notesel:el=>{saveNoteNow();S.noteSel=el.dataset.id;render()},noteback:()=>{S.noteSel=null;render()},opennote:el=>{S.noteSel=el.dataset.id;go('notes')},

  notedel:()=>confirmBox('刪除這則筆記？',()=>{delete db.notes[S.noteSel];S.noteSel=null;persist();render()},'刪除'),

    const lines=s.split('\n').map(x=>x.replace(/^\s*(-\s*\[.\]\s*|-\s*|#+\s*)/,'').trim()).filter(Boolean);if(!lines.length){toast('先選取或把游標放在要轉的那一行');return}

  projtab:el=>{S.projTab=el.dataset.v;render()},projfilter:el=>{S.projFilter=el.dataset.v;render()},projopen:el=>{S.projSel=el.dataset.id;render();$('#main').scrollTop=0},projback:()=>{S.projSel=null;render()},

  resetprompt:()=>{db.settings.aiPrompt=DEF_PROMPT;persist();render();toast('已還原')},resetholi:()=>{db.settings.holidaysText=HOLI_TEXT;HOL_SRC=null;persist();render();toast('已還原')},
  backup:()=>backupModal(),importjson:()=>importJsonModal(),
  csv:el=>{const k=el.dataset.k;textModal(`${{tasks:'任務',days:'每日',projects:'專案'}[k]} CSV`,{tasks:csvTasks,days:csvDays,projects:csvProjects}[k](),'<p class="sub" style="margin:0">複製後貼到 Excel，或存成 .csv 檔。</p>')},
  impsample:()=>{$('#im-x').value=IMP_SAMPLE;$('#im-y').value=2024},

  impview:el=>{const c=IMP.chunks[+el.dataset.i];const r=parseDay(c.text);openModal({title:`${c.date} 解析結果`,wide:true,body:`<pre class="mono" style="white-space:pre-wrap;font-size:12px;background:var(--surface-2);padding:10px;border-radius:8px;margin:0">${hlHTML(c.text,r,true)}</pre>${r.warnings.map(w=>`<div class="warn">第 ${w.i+1} 行：${esc(w.why)}｜<code>${esc(w.raw)}</code></div>`).join('')}<div class="sub">今日 ${r.today.length}・昨日完成 ${r.done.length}・未完成 ${r.undone.length}・突發 ${r.urgent.length}・加班 ${r.ot.length}</div>`,foot:'<button class="btn" data-act="mclose">關閉</button>'})},

document.addEventListener('click',e=>{const g=e.target.closest('[data-guide]');if(g){guideAction(g.dataset.guide,g);return}const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||(el.tagName==='INPUT'&&el.type!=='button'&&el.type!=='checkbox'))return;const f=ACT[el.dataset.act];if(f){f(el,e)}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.act==='setstatus'){const t=db.tasks[el.dataset.id];t.status=el.value;if(t.status==='已交付'&&!t.deliveredAt)t.deliveredAt=t.date;persist();toast('狀態已更新');render._keep=true;render()}
  if(el.dataset.act==='archyear'){S.archYear=el.value;render()}if(el.dataset.act==='archproj'){S.archProj=el.value;render()}

  if(el.dataset.rsel){if(el.checked)S.railSel.add(el.dataset.rsel);else S.railSel.delete(el.dataset.rsel)}});

/* ---------- 鍵盤 ---------- */
document.addEventListener('keydown',e=>{
  const tg=e.target;const editing=tg.closest&&tg.closest('input,textarea,select,[contenteditable="true"]');const k=e.key;const ctrl=e.ctrlKey||e.metaKey;
  if(k==='Escape'){if(modalStack.length){closeModal();e.preventDefault();return}
    if(editing){tg.blur();e.preventDefault();return}
    if($('#rail').classList.contains('open')){$('#rail').classList.remove('open');return}
    if(isInner())back();return}
  if(ctrl&&!e.shiftKey&&!e.altKey&&(k==='k'||k==='K')){e.preventDefault();if(!modalStack.length)openPalette();return}
  if(modalStack.length)return;
  if(e.altKey&&!ctrl&&/^[1-6]$/.test(k)){e.preventDefault();const p=PAGES[+k-1][0];if(p==='projects')S.projSel=null;go(p);return}
  if(S.page==='day'){
    const combo=(L)=>ctrl&&((e.shiftKey&&!e.altKey)||(e.altKey&&!e.shiftKey))&&(k.toLowerCase()===L||e.code==='Key'+L.toUpperCase());
    if(ctrl&&!e.shiftKey&&!e.altKey&&(k==='s'||k==='S')){e.preventDefault();if(!S.privacy)saveDay();return}
    if(combo('a')){e.preventDefault();ACT.copyai();return}
    if(combo('v')){e.preventDefault();if(!S.privacy)pasteModal();return}
    if(combo('c')){e.preventDefault();ACT.teams();return}
    if(combo('t')){e.preventDefault();if(!S.privacy)pickTodoModal();return}
    if(e.altKey&&(k==='PageUp'||k==='PageDown')){e.preventDefault();openDay(addD(S.day,k==='PageUp'?-1:1));return}
    if(!editing&&!ctrl&&!e.altKey){
      if(k==='['){openDay(addD(S.day,-1));return}if(k===']'){openDay(addD(S.day,1));return}
      if(k==='Enter'||k==='e'||k==='E'){if(S.privacy)return;e.preventDefault();if(!S.edit){S.edit=true;render()}setTimeout(()=>$('#ta')?.focus(),0);return}}}
  if(editing||ctrl||e.altKey)return;
  if(k==='/'){e.preventDefault();openSearch();return}
  if(k==='?'){e.preventDefault();helpModal();return}
  if(S.page==='calendar'){
    const c=S.cursor;let n=null;
    if(k==='ArrowLeft')n=addD(c,-1);if(k==='ArrowRight')n=addD(c,1);if(k==='ArrowUp')n=addD(c,S.calView==='year'?-7:-7);if(k==='ArrowDown')n=addD(c,7);
    if(n){e.preventDefault();S.cursor=n;render();$(`[data-cell="${n}"]`)?.focus();return}
    if(k==='Enter'){e.preventDefault();openDay(c);return}
    if(k==='PageUp'||k==='PageDown'){e.preventDefault();ACT.calmove({dataset:{n:k==='PageUp'?-1:1}});return}
    if(k==='w'||k==='W'){S.calView='week';render();return}if(k==='m'||k==='M'){S.calView='month';render();return}if(k==='y'||k==='Y'){S.calView='year';render();return}
    if(k==='t'||k==='T'){S.cursor=today();openDay(today());return}
    if(k==='n'||k==='N'){openTask(null);return}return}
  if(k==='t'||k==='T'){if(S.page!=='notes'){openDay(today());return}}
  if(S.page==='todo'){const G=todoGroups();const list=G[S.todoTab]||[];const t=list[S.todoSel];
    if(k==='ArrowDown'){e.preventDefault();S.todoSel=Math.min(list.length-1,S.todoSel+1);render._keep=true;render();$('.li.sel')?.scrollIntoView({block:'nearest'});return}
    if(k==='ArrowUp'){e.preventDefault();S.todoSel=Math.max(0,S.todoSel-1);render._keep=true;render();$('.li.sel')?.scrollIntoView({block:'nearest'});return}
    if(k==='ArrowRight'||k==='ArrowLeft'){const ks=Object.keys(G);const i=ks.indexOf(S.todoTab);S.todoTab=ks[(i+(k==='ArrowRight'?1:ks.length-1))%ks.length];S.todoSel=0;render();return}
    if(k==='n'||k==='N'){openTask(null);return}
    if(!t)return;
    if(k==='Enter'){e.preventDefault();openTask(t.id);return}
    if(k===' '){e.preventDefault();toggleDone(t.id);return}
    if(k==='d'||k==='D'){dlPrompt(t.id);return}if(k==='s'||k==='S'){schedPrompt(t.id);return}
    if(k==='Delete'||k==='Backspace'){if(t.archived)ACT.hardel({dataset:{id:t.id}});else ACT.archive({dataset:{id:t.id}});return}return}
  if(S.page==='notes'){if(k==='n'||k==='N'){newNote();return}
    const ns=Object.values(db.notes).sort((a,b)=>(b.pinned-a.pinned)||(b.updatedAt-a.updatedAt));const i=ns.findIndex(n=>n.id===S.noteSel);
    if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();const j=Math.max(0,Math.min(ns.length-1,i+(k==='ArrowDown'?1:-1)));if(ns[j]){S.noteSel=ns[j].id;render()}return}
    if(k==='Enter'&&S.noteSel){e.preventDefault();$('#n-body')?.focus();return}return}
  if(S.page==='projects'){
    if(k==='n'||k==='N'){openTask(null,S.projSel?{projectId:S.projSel}:{});return}
    if(S.projTab==='gantt'&&!S.projSel){const{rows}=ganttData();
      if(k==='ArrowDown'){e.preventDefault();S.gSel=Math.min(rows.length-1,S.gSel+1);render._keep=true;render();return}
      if(k==='ArrowUp'){e.preventDefault();S.gSel=Math.max(0,S.gSel-1);render._keep=true;render();return}
      if(k==='Enter'){e.preventDefault();const p=rows[S.gSel]?.p;if(p){S.gOpen[p.id]=!S.gOpen[p.id];render._keep=true;render()}return}
      if(k==='+'||k==='='){const z=['quarter','month','week'];S.gZoom=z[Math.min(2,z.indexOf(S.gZoom)+1)];render();return}
      if(k==='-'||k==='_'){const z=['quarter','month','week'];S.gZoom=z[Math.max(0,z.indexOf(S.gZoom)-1)];render();return}}
    if(!S.projSel&&S.projTab==='list'&&(k==='ArrowDown'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowLeft')){const cs=$$('.pcard');const i=cs.indexOf(document.activeElement);const j=Math.max(0,Math.min(cs.length-1,i+(k==='ArrowDown'||k==='ArrowRight'?1:-1)));cs[j]?.focus();e.preventDefault();return}
    if(k==='Enter'&&document.activeElement?.classList.contains('pcard')){ACT.projopen(document.activeElement);return}}
  if((k==='n'||k==='N')){openTask(null);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.target.closest('input,textarea,select,button')){const el=e.target.closest('[data-act][tabindex]');if(el&&!modalStack.length&&S.page!=='calendar'){e.preventDefault();el.click()}}});

/* ---------- 往右滑：回上一頁／關閉視窗 ---------- */
let SW=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1){SW=null;return}const t=e.touches[0];
  if(e.target.closest('.gwrap,.tbl-wrap,.wk,input[type=range],select'))return;
  const ta=e.target.closest('textarea');if(ta&&ta.selectionStart!==ta.selectionEnd)return;
  SW={x:t.clientX,y:t.clientY,t:Date.now()}},{passive:true});
document.addEventListener('touchmove',e=>{if(!SW)return;const t=e.touches[0];const dx=t.clientX-SW.x,dy=t.clientY-SW.y;
  if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx))SW=null},{passive:true});
document.addEventListener('touchend',e=>{if(!SW)return;const t=e.changedTouches[0];const dx=t.clientX-SW.x,dy=t.clientY-SW.y,dt=Date.now()-SW.t;SW=null;
  if(dx>80&&Math.abs(dy)<Math.abs(dx)*.5&&dt<800){
    if(modalStack.length){closeModal();return}
    if(!isInner())return;const m=$('#main');m.classList.add('swipe-back');setTimeout(()=>{m.classList.remove('swipe-back');back()},140)}},{passive:true});

if(!db){db=emptyDb();persist()}
applyTheme();render();
setTimeout(checkMorningReminder,700);

window.addEventListener('focus',checkMorningReminder);

if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
